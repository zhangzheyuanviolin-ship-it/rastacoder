name: Monitor Iteration v2 Build

on:
  push:
    branches:
      - iteration/qwen3-cn-ui-live-tools-google
    paths:
      - 'V2_MONITOR_TRIGGER.md'

permissions:
  actions: read
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout iteration branch
        uses: actions/checkout@v4
        with:
          ref: iteration/qwen3-cn-ui-live-tools-google
          fetch-depth: 0

      - name: Find and monitor latest v2 build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_JSON="$(gh run list --repo "$REPO" --workflow 'Build RastaCoder Chinese Live Tools v2' --branch 'iteration/qwen3-cn-ui-live-tools-google' --limit 1 --json databaseId,status,conclusion,url,headSha,number,attempt,event,createdAt,updatedAt)"
          RUN_ID="$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d[0]["databaseId"] if d else "")' <<<"$RUN_JSON")"
          test -n "$RUN_ID"
          echo "Monitoring run $RUN_ID"

          for _ in $(seq 1 120); do
            CURRENT="$(gh run view "$RUN_ID" --repo "$REPO" --json databaseId,status,conclusion,url,headSha,number,attempt,event,createdAt,updatedAt)"
            STATUS="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$CURRENT")"
            if [ "$STATUS" = "completed" ]; then
              printf '%s\n' "$CURRENT" > ITERATION_V2_RUN_STATUS.json
              break
            fi
            sleep 5
          done
          test -s ITERATION_V2_RUN_STATUS.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ITERATION_V2_RUN_STATUS.json
          git commit -m 'ci: record iteration v2 workflow result [skip ci]' || exit 0
          git pull --rebase origin iteration/qwen3-cn-ui-live-tools-google
          git push origin HEAD:iteration/qwen3-cn-ui-live-tools-google
