name: RastaCoder Actions Diagnostic

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'CI_ACTIONS_DIAGNOSTIC.md'

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Prove the workflow started and report recent runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --body "RastaCoder Actions diagnostic started. Run ID: $GITHUB_RUN_ID"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=30" \
            --jq '.workflow_runs[] | [.id,.name,.event,.status,(.conclusion // "null"),.head_sha,.html_url] | @tsv' \
            > recent-runs.tsv
          {
            echo 'Recent GitHub Actions runs:'
            echo
            echo '```'
            cat recent-runs.tsv
            echo '```'
          } > pr-comment.md
          gh pr comment "$PR_NUMBER" --body-file pr-comment.md
