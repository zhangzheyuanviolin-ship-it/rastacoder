name: Release RastaCoder Tool Reliability History v6

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-verify-release:
    name: Build verify persist and release v6 ARM64 update
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      V5_SOURCE_COMMIT: 6c50af4917f7908da0cce9b0ec15646f35bd3f30
      SOURCE_APK_URL: https://github.com/alexandertaboriskiy/navixmind/releases/download/v0.5.0-beta/app-debug.apk
      SOURCE_APK_SHA256: 94f574560ec469772021e284a12eabb71211393d25388c6669d854d58810a8ed
      EXPECTED_RUNTIME_SHA256: 5a3bb01f0819e85c07f58602161f6d020ecbf3e7f65922c9dfe898cfa0820c48
      EXPECTED_CERT_SHA256: 87d560a2d8f7a7c7fb8fd66b40ac6a40fb8f210a4f436fa468ecbbaa5b6170b8
      EXPECTED_PACKAGE: ai.navixmind
      BUILD_NAME: 0.0.5
      BUILD_NUMBER: '19'
      OUTPUT_APK: RastaCoder-Qwen3-4B-tool-reliability-history-v6-update.apk
      RELEASE_TAG: qwen3-tool-reliability-history-v6

    steps:
      - name: Checkout v6 reliability branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Restore exact persisted v5 source
        shell: bash
        run: |
          set -euo pipefail
          git checkout "$V5_SOURCE_COMMIT" -- \
            lib \
            python/navixmind \
            android/app/build.gradle \
            android/app/src/main/kotlin/ai/navixmind/services/MLCInferenceChannel.kt
          grep -F 'applicationId "ai.navixmind"' android/app/build.gradle
          grep -F 'RASTACODER_V5_SKILLS_PARAMS_BENCH_STREAM' python/navixmind/agent.py
          echo "Restored exact v5 source commit $V5_SOURCE_COMMIT"

      - name: Apply complete v6 patch chain
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/run_iteration_v6.py \
            scripts/apply_iteration_v6_reliability2.py \
            scripts/apply_iteration_v6_ui.py \
            scripts/apply_iteration_v6_history.py \
            scripts/apply_iteration_v6_native.py \
            scripts/validate_iteration_v6.py \
            scripts/validate_iteration_v6_extended.py
          python3 scripts/run_iteration_v6.py
          python3 scripts/apply_iteration_v6_reliability2.py
          python3 scripts/apply_iteration_v6_ui.py
          python3 scripts/apply_iteration_v6_history.py
          python3 scripts/apply_iteration_v6_native.py

      - name: Run systemic v6 pre-build gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_iteration_v6.py
          python3 scripts/validate_iteration_v6_extended.py
          python3 -m py_compile \
            python/navixmind/agent.py \
            python/navixmind/session.py \
            python/navixmind/tools/__init__.py \
            python/navixmind/tools/documents.py \
            python/navixmind/tools/google_api.py \
            python/navixmind/tools/compat.py

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Align inappwebview Android library compile SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          pub = Path(os.environ['PUB_CACHE']) / 'hosted' / 'pub.dev'
          candidates = sorted(pub.glob('flutter_inappwebview_android-*/android/build.gradle'))
          if not candidates:
              raise SystemExit('flutter_inappwebview_android build.gradle not found')
          p = candidates[-1]
          text = p.read_text()
          for old, new in {
              'compileSdkVersion 33': 'compileSdkVersion 35',
              'compileSdkVersion 34': 'compileSdkVersion 35',
              'compileSdk 33': 'compileSdk 35',
              'compileSdk 34': 'compileSdk 35',
          }.items():
              text = text.replace(old, new)
          p.write_text(text)
          PY

      - name: Flutter static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Restore exact known-good Qwen3 MLC runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 3 -o upstream-known-good.apk "$SOURCE_APK_URL"
          echo "$SOURCE_APK_SHA256  upstream-known-good.apk" | sha256sum -c -
          test "$(stat -c '%s' upstream-known-good.apk)" -eq 593655513
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          src = pathlib.Path('upstream-known-good.apk')
          dst = pathlib.Path('android/mlc4j/output/arm64-v8a/libtvm4j_runtime_packed.so')
          dst.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(src) as z:
              data = z.read('lib/arm64-v8a/libtvm4j_runtime_packed.so')
          assert len(data) == 38786520, len(data)
          digest = hashlib.sha256(data).hexdigest()
          assert digest == '5a3bb01f0819e85c07f58602161f6d020ecbf3e7f65922c9dfe898cfa0820c48', digest
          dst.write_bytes(data)
          print('Restored verified MLC runtime:', digest)
          PY

      - name: Restore stable RastaCoder signing identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/signing/rastacoder-dev-keystore.p12.b64 | base64 -d > android/app/rastacoder-dev.p12
          test "$(sha256sum android/app/rastacoder-dev.p12 | awk '{print $1}')" = "7048dea7d7152b80255716de2338eea539acd898cc3b8ecf8a9ca2203f21b169"
          cat > android/key.properties <<'EOF'
          storeFile=rastacoder-dev.p12
          storePassword=RastaCoderDev2026!
          keyAlias=rastacoder-dev
          keyPassword=RastaCoderDev2026!
          EOF

          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('android/app/build.gradle')
          text = p.read_text()
          pattern = re.compile(
              r'(\bdebug\s*\{\s*\n\s*buildConfigField\s+"boolean",\s*"NAVIXMIND_DEBUG",\s*"true"\s*\n)',
              re.MULTILINE,
          )
          replacement = r"\1            signingConfig keystoreProperties.containsKey('storeFile') ? signingConfigs.release : signingConfigs.debug\n"
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one debug buildType anchor, found {count}')
          p.write_text(text)
          print('Configured stable signing for in-place v6 update')
          PY

      - name: Build signed ARM64 v6 update APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          cp build/app/outputs/flutter-apk/app-debug.apk "$OUTPUT_APK"

      - name: Verify APK package version certificate ABI runtime and source gates
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            sdkmanager 'build-tools;35.0.0' >/dev/null
            APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          fi
          AAPT="$(dirname "$APKSIGNER")/aapt"
          test -x "$AAPT"

          BADGING="$($AAPT dump badging "$OUTPUT_APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -F "package: name='$EXPECTED_PACKAGE'"
          echo "$BADGING" | grep -F "versionCode='$BUILD_NUMBER'"
          echo "$BADGING" | grep -F "versionName='$BUILD_NAME'"

          "$APKSIGNER" verify --verbose --print-certs "$OUTPUT_APK" | tee apksigner.txt
          CERT_SHA="$(awk -F': ' '/certificate SHA-256 digest/{print tolower($NF); exit}' apksigner.txt | tr -d ':')"
          test "$CERT_SHA" = "$EXPECTED_CERT_SHA256"

          python3 - <<'PY'
          import hashlib, os, zipfile
          apk = os.environ['OUTPUT_APK']
          with zipfile.ZipFile(apk) as z:
              names = z.namelist()
              abis = sorted({n.split('/')[1] for n in names if n.startswith('lib/') and len(n.split('/')) >= 3})
              print('Native ABIs packaged:', abis)
              assert abis == ['arm64-v8a'], f'APK is not ARM64-only: {abis}'
              runtime = 'lib/arm64-v8a/libtvm4j_runtime_packed.so'
              assert runtime in names, 'arm64 MLC runtime missing'
              data = z.read(runtime)
              assert len(data) == 38786520, len(data)
              digest = hashlib.sha256(data).hexdigest()
              assert digest == '5a3bb01f0819e85c07f58602161f6d020ecbf3e7f65922c9dfe898cfa0820c48', digest
              assert any('flutter_assets' in n for n in names), 'Flutter assets missing'
              print('Verified MLC runtime:', digest)
          PY

          python3 scripts/validate_iteration_v6.py
          python3 scripts/validate_iteration_v6_extended.py

          OUT_SHA="$(sha256sum "$OUTPUT_APK" | awk '{print $1}')"
          OUT_SIZE="$(stat -c '%s' "$OUTPUT_APK")"
          echo "out_sha=$OUT_SHA" >> "$GITHUB_OUTPUT"
          echo "out_size=$OUT_SIZE" >> "$GITHUB_OUTPUT"
          echo "cert_sha=$CERT_SHA" >> "$GITHUB_OUTPUT"
          echo "APK SHA-256: $OUT_SHA"
          echo "APK size: $OUT_SIZE"

      - name: Persist final v6 source on reliability branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib python/navixmind android/app/build.gradle android/app/src/main/kotlin/ai/navixmind/services/MLCInferenceChannel.kt
          if ! git diff --cached --quiet; then
            git commit -m 'feat: persist tool reliability history v6 source [skip ci]'
            git push origin HEAD:iteration/qwen3-tool-reliability-v6
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_SHA: ${{ steps.verify.outputs.out_sha }}
          OUT_SIZE: ${{ steps.verify.outputs.out_size }}
          CERT_SHA: ${{ steps.verify.outputs.cert_sha }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          RastaCoder Qwen3 4B Tool Reliability + Chat History v6 — in-place ARM64 update APK.

          Upgrade identity verified in CI:
          - package/applicationId: $EXPECTED_PACKAGE
          - Android versionCode: $BUILD_NUMBER
          - versionName: $BUILD_NAME
          - signing certificate SHA-256: $CERT_SHA
          - native ABI: arm64-v8a only
          - known-good Qwen3 MLC runtime SHA-256: $EXPECTED_RUNTIME_SHA256

          v6 reliability work:
          - Keeps all 21 manually managed Skills and all 23 canonical tools with zero capability loss.
          - UI Skill IDs are no longer exposed as callable names to the 4B model; the model receives only enabled canonical function names and exact signatures.
          - Adds systemic alias/argument/path/output repair for small-model calls, including generic-param recovery for TXT/DOCX/PDF creation.
          - Directly regression-tests the reported TXT write, content-only DOCX creation and audio MP3-to-WAV failures.
          - Routes audio output conversion through the reliable native extract_audio path with explicit target format.
          - Prevents recognizable malformed tool-call wrappers from leaking into final prose and performs bounded correction retries.
          - Fixes MLC structured tool-call stream accumulation by call index and merges argument fragments.
          - Adds redacted per-query tool diagnostics with copy/share controls.
          - Preserves local Qwen reasoning separately and exposes an accessible collapsed Thinking panel plus explicit manual Thinking-mode state.
          - Wires the existing Isar Conversation/Message data layer into the chat UI: persistent history, new conversation, switch, rename, delete, auto-title, and Python SessionState resync.
          - Retains v5 model parameters and benchmark pages.

          Release gates:
          - both v6 21-Skill/23-tool systemic validators passed before build and again against the release source;
          - every canonical tool has a representative normalized call satisfying its actual required top-level schema;
          - Python compile and Flutter Analyze passed;
          - Android/Kotlin/Java/Chaquopy/MLC build passed;
          - APK package/version/signature/ABI/runtime were verified from the final APK.

          APK: $OUTPUT_APK
          APK SHA-256: $OUT_SHA
          APK size: $OUT_SIZE bytes
          EOF

          gh release delete "$RELEASE_TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$RELEASE_TAG" "$OUTPUT_APK" \
            --target iteration/qwen3-tool-reliability-v6 \
            --title 'RastaCoder Qwen3 4B Tool Reliability + Chat History v6' \
            --notes-file release-notes.md
