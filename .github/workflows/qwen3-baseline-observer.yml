name: Observe Qwen3 Build Runs

on:
  workflow_run:
    workflows:
      - "Produce Qwen3 Known-Good Baseline APK"
      - "Build RastaCoder Chinese Live Tools v2"
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Record completed workflow run
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_STATUS: ${{ github.event.workflow_run.status }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event.workflow_run.event }}
          CREATED_AT: ${{ github.event.workflow_run.created_at }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          workflow = os.environ["WORKFLOW_NAME"]
          if workflow == "Build RastaCoder Chinese Live Tools v2":
              output = "ITERATION_V2_RUN_STATUS.json"
          else:
              output = "QWEN3_RUN_STATUS.json"
          data = {
              "workflow": workflow,
              "run_id": int(os.environ["RUN_ID"]),
              "run_number": int(os.environ["RUN_NUMBER"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "status": os.environ["RUN_STATUS"],
              "conclusion": os.environ["RUN_CONCLUSION"],
              "html_url": os.environ["RUN_URL"],
              "head_sha": os.environ["HEAD_SHA"],
              "event": os.environ["EVENT_NAME"],
              "created_at": os.environ["CREATED_AT"],
              "updated_at": os.environ["UPDATED_AT"],
          }
          with open(output, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(output)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add QWEN3_RUN_STATUS.json ITERATION_V2_RUN_STATUS.json 2>/dev/null || true
          git commit -m "ci: record completed Qwen3 workflow result" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
