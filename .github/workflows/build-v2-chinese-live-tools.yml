name: Build RastaCoder v2 Chinese Live Tools

on:
  push:
    branches:
      - v2/chinese-live-tools-google
    paths:
      - '.github/workflows/build-v2-chinese-live-tools.yml'
      - '.github/signing/rastacoder-dev-keystore.p12.b64'
      - 'tools/apply_v2_source_patches.py'
      - 'lib/features/chat/presentation/widgets/reasoning_disclosure.dart'
      - 'GOOGLE_OAUTH_RASTACODER.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v2:
    name: Build, verify, and release v2 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FLUTTER_VERSION: '3.22.0'
      SOURCE_APK_URL: https://github.com/alexandertaboriskiy/navixmind/releases/download/v0.5.0-beta/app-debug.apk
      SOURCE_APK_SHA256: 94f574560ec469772021e284a12eabb71211393d25388c6669d854d58810a8ed
      SOURCE_RUNTIME_SHA256: 5a3bb01f0819e85c07f58602161f6d020ecbf3e7f65922c9dfe898cfa0820c48
      SOURCE_RUNTIME_SIZE: '38786520'
      TVM_RELAX_COMMIT: 837cb9de1127b48ce48e4cefe09e83215b9d4ba7
      EXPECTED_CERT_SHA256: 87d560a2d8f7a7c7fb8fd66b40ac6a40fb8f210a4f436fa468ecbbaa5b6170b8
      KEYSTORE_PASSWORD: RastaCoderDev2026!
      KEY_ALIAS: rastacoder-dev
      OUTPUT_APK: RastaCoder-Qwen3-4B-v2-Chinese-LiveTools.apk
      RELEASE_TAG: qwen3-v2-chinese-live-tools

    steps:
      - name: Checkout exact v2 source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Materialize v2 source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_v2_source_patches.py
          grep -Fq "version: 0.0.2+16" pubspec.yaml
          ! grep -Fq "296863031657-69hn38bhprhqvrda6vd795sp65e8764d.apps.googleusercontent.com" lib/core/services/auth_service.dart
          grep -Fq "ReasoningDisclosure" lib/features/chat/presentation/widgets/message_bubble.dart
          grep -Fq "NativeToolActivityStage.started" lib/core/services/native_tool_executor.dart
          grep -Fq "正在执行工具" lib/features/chat/presentation/chat_screen.dart
          git diff --check

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Restore exact known-good MLC runtime from verified official APK
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 3 -o /tmp/navixmind-known-good.apk "$SOURCE_APK_URL"
          echo "$SOURCE_APK_SHA256  /tmp/navixmind-known-good.apk" | sha256sum -c -
          mkdir -p android/mlc4j/output/arm64-v8a
          python3 - <<'PY'
          import hashlib
          import os
          import zipfile

          apk = '/tmp/navixmind-known-good.apk'
          out = 'android/mlc4j/output/arm64-v8a/libtvm4j_runtime_packed.so'
          path = 'lib/arm64-v8a/libtvm4j_runtime_packed.so'
          with zipfile.ZipFile(apk) as zf:
              data = zf.read(path)
          digest = hashlib.sha256(data).hexdigest()
          if digest != os.environ['SOURCE_RUNTIME_SHA256']:
              raise SystemExit(f'runtime SHA mismatch: {digest}')
          if len(data) != int(os.environ['SOURCE_RUNTIME_SIZE']):
              raise SystemExit(f'runtime size mismatch: {len(data)}')
          with open(out, 'wb') as f:
              f.write(data)
          print(f'Preserved exact runtime: {path} {len(data)} bytes {digest}')
          PY

      - name: Rebuild matching TVM4J Java binding only
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none https://github.com/mlc-ai/relax.git /tmp/tvm-relax
          git -C /tmp/tvm-relax checkout --quiet "$TVM_RELAX_COMMIT"
          mvn -q -f /tmp/tvm-relax/jvm/pom.xml \
            -pl core \
            -DskipTests \
            -Dcheckstyle.skip=true \
            -Dmaven.javadoc.skip=true \
            package
          TVM_JAR="/tmp/tvm-relax/jvm/core/target/tvm4j-core-0.0.1-SNAPSHOT.jar"
          test -f "$TVM_JAR"
          cp "$TVM_JAR" android/mlc4j/output/tvm4j_core.jar
          jar tf android/mlc4j/output/tvm4j_core.jar | grep -Fq 'org/apache/tvm/Function.class'
          jar tf android/mlc4j/output/tvm4j_core.jar | grep -Fq 'org/apache/tvm/Device.class'
          echo "TVM4J core SHA-256: $(sha256sum android/mlc4j/output/tvm4j_core.jar | awk '{print $1}')"

      - name: Resolve Flutter dependencies and format patched Dart
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib

      - name: Compile arm64 release APK from source
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm64
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Locate Android signing tools
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          BUILD_TOOLS_DIR="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [ -z "$BUILD_TOOLS_DIR" ] || [ ! -x "$BUILD_TOOLS_DIR/apksigner" ] || [ ! -x "$BUILD_TOOLS_DIR/zipalign" ]; then
            sdkmanager 'build-tools;35.0.0' >/dev/null
            BUILD_TOOLS_DIR="$SDK_ROOT/build-tools/35.0.0"
          fi
          echo "apksigner=$BUILD_TOOLS_DIR/apksigner" >> "$GITHUB_OUTPUT"
          echo "zipalign=$BUILD_TOOLS_DIR/zipalign" >> "$GITHUB_OUTPUT"
          echo "aapt=$BUILD_TOOLS_DIR/aapt" >> "$GITHUB_OUTPUT"

      - name: Re-sign v2 with stable RastaCoder project certificate
        shell: bash
        env:
          APKSIGNER: ${{ steps.tools.outputs.apksigner }}
          ZIPALIGN: ${{ steps.tools.outputs.zipalign }}
        run: |
          set -euo pipefail
          base64 -d .github/signing/rastacoder-dev-keystore.p12.b64 > /tmp/rastacoder-dev.p12
          test "$(sha256sum /tmp/rastacoder-dev.p12 | awk '{print $1}')" = "7048dea7d7152b80255716de2338eea539acd898cc3b8ecf8a9ca2203f21b169"

          cp build/app/outputs/flutter-apk/app-release.apk /tmp/v2-unsigned.apk
          zip -q -d /tmp/v2-unsigned.apk 'META-INF/*.RSA' 'META-INF/*.SF' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/MANIFEST.MF' || true
          "$ZIPALIGN" -f -p 4 /tmp/v2-unsigned.apk /tmp/v2-aligned.apk
          "$APKSIGNER" sign \
            --ks /tmp/rastacoder-dev.p12 \
            --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUTPUT_APK" \
            /tmp/v2-aligned.apk

      - name: Validate v2 package, signature, runtime, model registration, and Chinese UI payload
        id: verify
        shell: bash
        env:
          APKSIGNER: ${{ steps.tools.outputs.apksigner }}
          AAPT: ${{ steps.tools.outputs.aapt }}
        run: |
          set -euo pipefail
          "$APKSIGNER" verify --verbose --print-certs "$OUTPUT_APK" | tee /tmp/apksigner.txt
          CERT_SHA="$(awk -F': ' '/certificate SHA-256 digest/{print tolower($NF); exit}' /tmp/apksigner.txt | tr -d ':')"
          test "$CERT_SHA" = "$EXPECTED_CERT_SHA256"

          BADGING="$($AAPT dump badging "$OUTPUT_APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -Fq "package: name='ai.navixmind'"
          echo "$BADGING" | grep -Fq "versionCode='16'"

          python3 - <<'PY'
          import hashlib
          import os
          import zipfile

          apk = os.environ['OUTPUT_APK']
          runtime_path = 'lib/arm64-v8a/libtvm4j_runtime_packed.so'
          with zipfile.ZipFile(apk) as zf:
              names = set(zf.namelist())
              if runtime_path not in names:
                  raise SystemExit('arm64 MLC runtime missing from v2 APK')
              runtime = zf.read(runtime_path)
              digest = hashlib.sha256(runtime).hexdigest()
              if digest != os.environ['SOURCE_RUNTIME_SHA256'] or len(runtime) != int(os.environ['SOURCE_RUNTIME_SIZE']):
                  raise SystemExit(f'MLC runtime changed: {len(runtime)} bytes {digest}')

              configs = [n for n in names if n.endswith('mlc-app-config.json')]
              if not configs:
                  raise SystemExit('mlc-app-config.json missing')
              config = zf.read(configs[0])
              for needle in (
                  b'Qwen3-4B-q4f16_0-MLC',
                  b'qwen3_q4f16_0_744427a6c2d881a41e79d0bfb2a540dc',
              ):
                  if needle not in config:
                      raise SystemExit(f'missing model registration: {needle!r}')
          print('Exact known-good MLC runtime and Qwen3 registration preserved')
          PY

          # Flutter AOT text is binary, so source assertions above are the
          # deterministic verification for Chinese copy/reasoning behavior.
          OUT_SHA="$(sha256sum "$OUTPUT_APK" | awk '{print $1}')"
          OUT_SIZE="$(stat -c '%s' "$OUTPUT_APK")"
          echo "out_sha=$OUT_SHA" >> "$GITHUB_OUTPUT"
          echo "out_size=$OUT_SIZE" >> "$GITHUB_OUTPUT"
          echo "cert_sha=$CERT_SHA" >> "$GITHUB_OUTPUT"

      - name: Publish RastaCoder v2 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_SHA: ${{ steps.verify.outputs.out_sha }}
          OUT_SIZE: ${{ steps.verify.outputs.out_size }}
          CERT_SHA: ${{ steps.verify.outputs.cert_sha }}
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<EOF
          RastaCoder v2 — Chinese UI, collapsed reasoning, and live tool activity.

          Changes in this test build:
          - Chinese-first application UI copy.
          - Qwen `<think>...</think>` reasoning is retained but collapsed by default; the normal reply and accessibility announcement expose the final answer first.
          - Native tool execution emits immediate start/success/failure activity into the chat/status UI; Python tool logs remain live through the existing event bridge.
          - Removed the original developer's hard-coded Google Web OAuth client ID.
          - Existing Gmail read/list and Google Calendar list/create agent tools are preserved.

          Google OAuth external requirement:
          - Package: ai.navixmind
          - Signing SHA-1: 74:5D:97:54:87:32:A9:DE:D0:96:6E:A5:58:8E:78:68:8F:85:31:B6
          - An Android OAuth client for that exact identity must exist in a Google Cloud project with Gmail API + Calendar API enabled and the testing account authorized. See GOOGLE_OAUTH_RASTACODER.md in the repository.

          Regression guarantees:
          - Qwen3 model_id: Qwen3-4B-q4f16_0-MLC
          - Qwen3 model_lib: qwen3_q4f16_0_744427a6c2d881a41e79d0bfb2a540dc
          - Known-good MLC runtime SHA-256: $SOURCE_RUNTIME_SHA256
          - Stable RastaCoder certificate SHA-256: $CERT_SHA
          - APK SHA-256: $OUT_SHA
          - APK size: $OUT_SIZE bytes
          EOF

          gh release delete "$RELEASE_TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$RELEASE_TAG" "$OUTPUT_APK" \
            --target "$GITHUB_SHA" \
            --title 'RastaCoder v2 — Chinese UI & Live Tools' \
            --notes-file /tmp/release-notes.md
