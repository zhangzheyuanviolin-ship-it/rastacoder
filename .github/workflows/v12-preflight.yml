name: Preflight RastaCoder Workspace Alias Hardening v12

on:
  push:
    branches:
      - iteration/qwen3-workspace-alias-hardening-v12
    paths:
      - 'V12_PREFLIGHT_TRIGGER.md'

permissions:
  contents: read

jobs:
  preflight-v12:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout v12 branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile v12 patch and validators before touching source
        run: |
          python3 -m py_compile \
            scripts/apply_iteration_v12_workspace_alias_hardening.py \
            scripts/validate_iteration_v10.py \
            scripts/validate_iteration_v11.py \
            scripts/validate_iteration_v12.py

      - name: Apply reviewed v12 patch
        run: python3 scripts/apply_iteration_v12_workspace_alias_hardening.py

      - name: Compile generated Python source
        run: |
          python3 -m py_compile \
            python/navixmind/agent.py \
            python/navixmind/tools/__init__.py \
            python/navixmind/tools/compat.py \
            python/navixmind/tools/extended_tools.py \
            python/navixmind/tools/path_contract.py \
            scripts/validate_iteration_v10.py \
            scripts/validate_iteration_v11.py \
            scripts/validate_iteration_v12.py

      - name: Install validation dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install anthropic requests beautifulsoup4 lxml pypdf reportlab python-docx python-pptx openpyxl Pillow yt-dlp numpy pandas matplotlib

      - name: Preserve v9 systemic tool regression gates
        run: python3 scripts/run_validate_iteration_v9.py

      - name: Preserve v10 context-safe and history gates
        run: python3 scripts/validate_iteration_v10.py

      - name: Preserve v11 workspace and OpenAI-compatible gates
        run: python3 scripts/validate_iteration_v11.py

      - name: Run exact and systemic v12 workspace alias gates
        run: python3 scripts/validate_iteration_v12.py

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Align inappwebview Android library compile SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          pub = Path(os.environ['PUB_CACHE']) / 'hosted' / 'pub.dev'
          candidates = sorted(pub.glob('flutter_inappwebview_android-*/android/build.gradle'))
          if not candidates:
              raise SystemExit('flutter_inappwebview_android build.gradle not found')
          p = candidates[-1]
          text = p.read_text()
          for old, new in {
              'compileSdkVersion 33': 'compileSdkVersion 35',
              'compileSdkVersion 34': 'compileSdkVersion 35',
              'compileSdk 33': 'compileSdk 35',
              'compileSdk 34': 'compileSdk 35',
          }.items():
              text = text.replace(old, new)
          p.write_text(text)
          PY

      - name: Flutter static analysis gate
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Preflight summary
        run: |
          echo 'V12 no-APK preflight passed.'
          echo 'Exact user call list_files(path=/workspace) resolves to the real app workspace.'
          echo 'Virtual /output and nested /workspace/... aliases share the same path contract across executor and extended tools.'
          echo 'Model-facing file listings contain logical paths and do not expose physical workspace roots.'
          echo 'Workspace listing failures give explicit path=. retry guidance.'
          echo 'All v9/v10/v11 inherited regression gates remain green.'
