name: Preflight RastaCoder Residual Runtime Hardening v16

on:
  push:
    branches:
      - iteration/qwen3-residual-runtime-hardening-v16
    paths:
      - 'V16_PREFLIGHT_TRIGGER.md'

permissions:
  contents: read

env:
  RUNTIME_PROBE_RUN: '33041507127'

jobs:
  preflight-v16:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout v16 branch
        uses: actions/checkout@v4

      - name: Verify locked exact MLC/native runtime probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUNTIME_PROBE_RUN}" --jq '.conclusion')"
          test "$conclusion" = "success"
          echo "Locked V16 runtime probe: $RUNTIME_PROBE_RUN = $conclusion"

      - name: Setup Python 3.11 for host regression tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile reviewed patch scripts and validators before touching source
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/apply_iteration_v15_documents_runtime.py \
            scripts/apply_iteration_v15_curl_cffi_compat.py \
            scripts/apply_iteration_v15_python_sandbox.py \
            scripts/apply_iteration_v15_media.py \
            scripts/apply_iteration_v15_unlimited_tools.py \
            scripts/apply_iteration_v16_residual_hardening.py \
            scripts/prepare_curl_cffi_android_wheel.py \
            scripts/prepare_curl_cffi_native_companion_v16.py \
            scripts/validate_iteration_v10.py \
            scripts/validate_iteration_v11.py \
            scripts/validate_iteration_v12.py \
            scripts/validate_iteration_v13.py \
            scripts/validate_iteration_v14.py \
            scripts/validate_iteration_v15.py \
            scripts/validate_iteration_v15_curl_cffi_compat.py \
            scripts/validate_iteration_v16.py

      - name: Apply inherited V15 and reviewed V16 patches
        run: |
          set -euo pipefail
          python3 scripts/apply_iteration_v15_documents_runtime.py
          python3 scripts/apply_iteration_v15_curl_cffi_compat.py
          python3 scripts/apply_iteration_v15_python_sandbox.py
          python3 scripts/apply_iteration_v15_media.py
          python3 scripts/apply_iteration_v15_unlimited_tools.py
          python3 scripts/apply_iteration_v16_residual_hardening.py

      - name: Compile generated Python source
        run: |
          set -euo pipefail
          python3 -m py_compile \
            python/navixmind/agent.py \
            python/navixmind/tools/__init__.py \
            python/navixmind/tools/compat.py \
            python/navixmind/tools/documents.py \
            python/navixmind/tools/extended_tools.py \
            python/navixmind/tools/code_executor.py \
            python/navixmind/tools/media.py \
            scripts/validate_iteration_v16.py

      - name: Install host validation dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            anthropic requests beautifulsoup4 lxml pypdf reportlab \
            python-docx python-pptx openpyxl Pillow yt-dlp \
            'numpy<2' 'pandas<3' 'matplotlib<4'

      - name: Run V9 through V16 functional regression gates
        run: |
          set -euo pipefail
          python3 scripts/run_validate_iteration_v9.py
          python3 scripts/validate_iteration_v10.py
          python3 scripts/validate_iteration_v11.py
          python3 scripts/validate_iteration_v12.py
          python3 scripts/validate_iteration_v13.py
          python3 scripts/validate_iteration_v14.py
          python3 scripts/validate_iteration_v15.py
          python3 scripts/validate_iteration_v16.py

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Align inappwebview Android library compile SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          pub = Path(os.environ['PUB_CACHE']) / 'hosted' / 'pub.dev'
          candidates = sorted(pub.glob('flutter_inappwebview_android-*/android/build.gradle'))
          if not candidates:
              raise SystemExit('flutter_inappwebview_android build.gradle not found')
          p = candidates[-1]
          text = p.read_text()
          for old, new in {
              'compileSdkVersion 33': 'compileSdkVersion 35',
              'compileSdkVersion 34': 'compileSdkVersion 35',
              'compileSdk 33': 'compileSdk 35',
              'compileSdk 34': 'compileSdk 35',
          }.items():
              text = text.replace(old, new)
          p.write_text(text)
          PY

      - name: Flutter static analysis gate
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Setup Python 3.13 for exact Android Chaquopy runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prepare exact curl-cffi Android binary and all wheel-private companions
        run: |
          set -euo pipefail
          python3 scripts/prepare_curl_cffi_android_wheel.py
          python3 scripts/validate_iteration_v15_curl_cffi_compat.py
          python3 scripts/prepare_curl_cffi_native_companion_v16.py | tee /tmp/v16-native-prep.log
          grep -F 'required companion: libc++_shared-d523468d.so' /tmp/v16-native-prep.log
          test -f android/app/src/main/jniLibs/arm64-v8a/libc++_shared-d523468d.so
          python3 - <<'PY'
          import re, zipfile
          from pathlib import Path
          wheel = Path('android/app/vendor/curl_cffi-0.16.2-cp313-cp313-android_24_arm64_v8a.whl')
          with zipfile.ZipFile(wheel) as z:
              wrapper_name = next(n for n in z.namelist() if n.endswith('.so') and '/_wrapper' in n)
              wrapper = z.read(wrapper_name)
              needed = sorted(set(m.decode() for m in re.findall(rb'lib[A-Za-z0-9+_.-]+-[0-9a-fA-F]+\.so', wrapper)))
              assert needed == ['libc++_shared-d523468d.so'], needed
              for name in needed:
                  member = next(n for n in z.namelist() if Path(n).name == name)
                  packaged = Path('android/app/src/main/jniLibs/arm64-v8a') / name
                  assert packaged.read_bytes() == z.read(member), name
          print('All wheel-private DT_NEEDED companions are byte-identical and packaged.')
          PY

      - name: Setup Gradle 8.4 for no-APK dependency resolution
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Resolve exact ARM64 Android Python requirements without building APK
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_BIN="$(command -v flutter)"
          FLUTTER_SDK="$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          cat > android/local.properties <<EOF
          sdk.dir=$SDK_ROOT
          flutter.sdk=$FLUTTER_SDK
          EOF
          gradle -p android :app:generateDebugPythonRequirements --no-daemon 2>&1 | tee /tmp/v16-python-resolution.log
          verify_dep() {
            local pattern="$1"
            if grep -Eiq "$pattern" /tmp/v16-python-resolution.log; then return 0; fi
            if find android/app/build -print 2>/dev/null | grep -Eiq "$pattern"; then return 0; fi
            echo "Required Android Python dependency was not resolved: $pattern" >&2
            exit 1
          }
          verify_dep 'curl[_-]cffi.*0\.16\.2|curl[_-]cffi-0\.16\.2'
          verify_dep 'cffi.*1\.17\.1|cffi-1\.17\.1'
          verify_dep 'matplotlib.*3\.8\.4|matplotlib-3\.8\.4'
          verify_dep 'pandas.*2\.1\.3|pandas-2\.1\.3'
          verify_dep 'numpy.*1\.26\.2|numpy-1\.26\.2'
          if find . -type f -name '*.apk' -print | grep -q .; then
            echo 'Preflight unexpectedly produced an APK.' >&2
            exit 1
          fi

      - name: Preflight summary
        run: |
          echo 'V16 full no-APK preflight passed.'
          echo 'All inherited V9-V15 gates remain green.'
          echo 'Safe os.path exists/isfile/isdir/getsize/getmtime are scoped to supplied files and OUTPUT_DIR.'
          echo 'create_xlsx/read_xlsx roundtrip is verified for canonical, compatibility-wrapper and record-object inputs.'
          echo 'curl-cffi wheel-private native companions are packaged byte-identically under exact DT_NEEDED filenames.'
          echo 'The fixed verified MLC runtime contains exactly the five model libraries already exposed by the UI; no unverified model was added.'
          echo 'Flutter analysis and exact Android Python dependency resolution passed without producing an APK.'
