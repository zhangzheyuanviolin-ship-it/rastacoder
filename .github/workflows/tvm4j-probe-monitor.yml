name: Monitor TVM4J Probe

on:
  push:
    branches: [iteration/qwen3-cn-ui-live-tools-google]
    paths: ['TVM4J_MONITOR_TRIGGER.md']

permissions:
  actions: read
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: iteration/qwen3-cn-ui-live-tools-google
          fetch-depth: 0
      - name: Monitor latest probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "$REPO" --workflow 'Probe TVM4J Core Binding' --branch 'iteration/qwen3-cn-ui-live-tools-google' --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          for _ in $(seq 1 100); do
            CURRENT="$(gh run view "$RUN_ID" --repo "$REPO" --json databaseId,status,conclusion,url,headSha,number,attempt,event,createdAt,updatedAt)"
            STATUS="$(jq -r .status <<<"$CURRENT")"
            if [ "$STATUS" = completed ]; then
              printf '%s\n' "$CURRENT" > TVM4J_PROBE_RUN_STATUS.json
              break
            fi
            sleep 3
          done
          test -s TVM4J_PROBE_RUN_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TVM4J_PROBE_RUN_STATUS.json
          git commit -m 'ci: record TVM4J probe run [skip ci]' || exit 0
          git pull --rebase origin iteration/qwen3-cn-ui-live-tools-google
          git push origin HEAD:iteration/qwen3-cn-ui-live-tools-google
