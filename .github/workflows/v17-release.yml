name: Release RastaCoder Local Tool Contract Recovery v17

on:
  push:
    branches:
      - iteration/qwen3-local-tool-contract-recovery-v17
    paths:
      - 'V17_RELEASE_TRIGGER.md'

permissions:
  contents: write

env:
  RUNTIME_PROBE_RUN: '33041507127'

jobs:
  release-v17:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    env:
      SOURCE_APK_URL: https://github.com/alexandertaboriskiy/navixmind/releases/download/v0.5.0-beta/app-debug.apk
      SOURCE_APK_SHA256: 94f574560ec469772021e284a12eabb71211393d25388c6669d854d58810a8ed
      EXPECTED_RUNTIME_SHA256: 5a3bb01f0819e85c07f58602161f6d020ecbf3e7f65922c9dfe898cfa0820c48
      EXPECTED_CERT_SHA256: 87d560a2d8f7a7c7fb8fd66b40ac6a40fb8f210a4f436fa468ecbbaa5b6170b8
      EXPECTED_PACKAGE: ai.navixmind
      BUILD_NAME: 0.0.16
      BUILD_NUMBER: '30'
      OUTPUT_APK: RastaCoder-Qwen3-4B-local-tool-contract-recovery-v17-update.apk
      RELEASE_TAG: qwen3-local-tool-contract-recovery-v17
      PREFLIGHT_RUN: '33052838100'
      PRIVATE_CURL_LIB: libc++_shared-d523468d.so
    steps:
      - name: Checkout V17 release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify locked successful V17 no-APK preflight before build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          preflight="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN}" --jq '.conclusion')"
          probe="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUNTIME_PROBE_RUN}" --jq '.conclusion')"
          test "$preflight" = "success"
          test "$probe" = "success"
          echo "Locked V17 preflight: $PREFLIGHT_RUN = $preflight"
          echo "Locked runtime probe: $RUNTIME_PROBE_RUN = $probe"

      - name: Setup Python 3.11 for local-first prebuild gates
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java for Android build
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter for the single formal APK build
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Run locked V17 pre-build local-tool phase
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/v17_release_phase1.sh

      - name: Setup Python 3.13 for Android Chaquopy and curl-cffi
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Gradle 8.4 for exact Android dependency and build phase
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build exactly one V17 APK and verify binary payloads
        run: bash scripts/v17_release_phase2a_build.sh

      - name: Restore Python 3.11 for final V9-V17 regressions
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Persist verified V17 source and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/v17_release_phase2b_publish.sh

      - name: Cleanup signing and generated native vendor materials
        if: always()
        run: |
          rm -f android/app/rastacoder-dev.p12 android/key.properties android/local.properties upstream-known-good.apk
          rm -rf android/app/vendor
          rm -f "android/app/src/main/jniLibs/arm64-v8a/$PRIVATE_CURL_LIB"
