name: Build RastaCoder APK (legacy source build)

# The current post-rename main source tree is known to contain compile-time
# inconsistencies introduced by the March 13 RastaCoder rename. Keep this
# workflow manual-only so pushes do not burn Actions runs on a baseline that
# has not yet been repaired against the known-good Qwen3 source snapshot.
on:
  workflow_dispatch:

jobs:
  legacy-source-build:
    name: Legacy source build (manual only)
    runs-on: ubuntu-latest

    steps:
      - name: Explain current status
        run: |
          echo "Automatic source builds are intentionally disabled."
          echo "Use the Qwen3 known-good baseline workflow for the validated APK baseline."
          echo "Source reconstruction continues from baseline/qwen3-official-v0.5.0."
