name: RastaCoder v7 Complete Skills Preflight

on:
  push:
    branches:
      - iteration/qwen3-complete-skills-v7
    paths:
      - '.github/workflows/v7-preflight.yml'
      - 'python/navixmind/tools/extended_tools.py'
      - 'scripts/apply_iteration_v7_*.py'
      - 'scripts/run_iteration_v7_tools.py'
      - 'scripts/validate_iteration_v7.py'
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply complete v7 patch chain to persisted v6 source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run_iteration_v7_tools.py
          python3 scripts/apply_iteration_v7_native.py
          python3 scripts/apply_iteration_v7_ui.py
          python3 scripts/apply_iteration_v7_preoffice.py
          python3 scripts/apply_iteration_v7_office.py

      - name: Compile Python sources and patch scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/apply_iteration_v7_tools.py \
            scripts/run_iteration_v7_tools.py \
            scripts/apply_iteration_v7_native.py \
            scripts/apply_iteration_v7_ui.py \
            scripts/apply_iteration_v7_preoffice.py \
            scripts/apply_iteration_v7_office.py \
            scripts/validate_iteration_v7.py \
            python/navixmind/tools/extended_tools.py \
            python/navixmind/tools/__init__.py \
            python/navixmind/tools/documents.py \
            python/navixmind/tools/google_api.py \
            python/navixmind/agent.py

      - name: Install validator dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests beautifulsoup4 lxml pypdf reportlab python-docx python-pptx openpyxl Pillow yt-dlp numpy pandas matplotlib

      - name: Run systemic 21-Skill complete-capability validation
        run: python3 scripts/validate_iteration_v7.py

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Flutter dependency and analyzer gate
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Preflight summary
        run: |
          echo 'v7 preflight passed without building an APK.'
          echo '21 manual Skills cover 31 canonical local tools.'
          echo 'File lifecycle, ZIP extract/list, image compose, PDF page management, PPTX/XLSX creation, FFmpeg custom/multi-input schema, accessibility semantics, and local-model restore gates passed.'
