name: Release RastaCoder Residual Runtime Hardening v16

on:
  push:
    branches:
      - iteration/qwen3-residual-runtime-hardening-v16
    paths:
      - 'V16_RELEASE_TRIGGER.md'

permissions:
  contents: write

env:
  SOURCE_APK_URL: https://github.com/alexandertaboriskiy/navixmind/releases/download/v0.5.0-beta/app-debug.apk
  SOURCE_APK_SHA256: 94f574560ec469772021e284a12eabb71211393d25388c6669d854d58810a8ed
  EXPECTED_RUNTIME_SHA256: 5a3bb01f0819e85c07f58602161f6d020ecbf3e7f65922c9dfe898cfa0820c48
  EXPECTED_CERT_SHA256: 87d560a2d8f7a7c7fb8fd66b40ac6a40fb8f210a4f436fa468ecbbaa5b6170b8
  EXPECTED_PACKAGE: ai.navixmind
  BUILD_NAME: 0.0.15
  BUILD_NUMBER: '29'
  OUTPUT_APK: RastaCoder-Qwen3-4B-residual-runtime-hardening-v16-update.apk
  RELEASE_TAG: qwen3-residual-runtime-hardening-v16
  PREFLIGHT_RUN: '33041993590'
  RUNTIME_PROBE_RUN: '33041507127'
  PRIVATE_CURL_LIB: libc++_shared-d523468d.so

jobs:
  release-v16:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout v16 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify locked successful V16 gates before any APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          preflight="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN}" --jq '.conclusion')"
          probe="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUNTIME_PROBE_RUN}" --jq '.conclusion')"
          test "$preflight" = "success"
          test "$probe" = "success"
          echo "Locked V16 full no-APK preflight: $PREFLIGHT_RUN = $preflight"
          echo "Locked V16 MLC/native binary probe: $RUNTIME_PROBE_RUN = $probe"

      - name: Setup Python 3.11 for host regression tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Verify persisted V15 baseline and apply only reviewed V16 delta
        run: |
          set -euo pipefail
          grep -F 'version "3.13"' android/app/build.gradle
          grep -F 'install "cffi==1.17.1"' android/app/build.gradle
          grep -F 'vendor/curl_cffi-0.16.2-cp313-cp313-android_24_arm64_v8a.whl' android/app/build.gradle
          grep -F 'com.chaquo.python:gradle:16.1.0' android/build.gradle
          python3 -m py_compile \
            scripts/apply_iteration_v16_residual_hardening.py \
            scripts/prepare_curl_cffi_android_wheel.py \
            scripts/prepare_curl_cffi_native_companion_v16.py \
            scripts/validate_iteration_v16.py
          python3 scripts/apply_iteration_v16_residual_hardening.py
          python3 -m py_compile \
            python/navixmind/agent.py \
            python/navixmind/tools/__init__.py \
            python/navixmind/tools/compat.py \
            python/navixmind/tools/documents.py \
            python/navixmind/tools/extended_tools.py \
            python/navixmind/tools/code_executor.py \
            python/navixmind/tools/media.py

      - name: Run V9 through V16 functional gates before build
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            anthropic requests beautifulsoup4 lxml pypdf reportlab \
            python-docx python-pptx openpyxl Pillow yt-dlp \
            'numpy<2' 'pandas<3' 'matplotlib<4'
          python3 scripts/run_validate_iteration_v9.py
          python3 scripts/validate_iteration_v10.py
          python3 scripts/validate_iteration_v11.py
          python3 scripts/validate_iteration_v12.py
          python3 scripts/validate_iteration_v13.py
          python3 scripts/validate_iteration_v14.py
          python3 scripts/validate_iteration_v15.py
          python3 scripts/validate_iteration_v16.py

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Align inappwebview Android library compile SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          pub = Path(os.environ['PUB_CACHE']) / 'hosted' / 'pub.dev'
          candidates = sorted(pub.glob('flutter_inappwebview_android-*/android/build.gradle'))
          if not candidates:
              raise SystemExit('flutter_inappwebview_android build.gradle not found')
          p = candidates[-1]
          text = p.read_text()
          for old, new in {
              'compileSdkVersion 33': 'compileSdkVersion 35',
              'compileSdkVersion 34': 'compileSdkVersion 35',
              'compileSdk 33': 'compileSdk 35',
              'compileSdk 34': 'compileSdk 35',
          }.items():
              text = text.replace(old, new)
          p.write_text(text)
          PY

      - name: Flutter static analysis gate before APK build
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Setup Python 3.13 for Android Chaquopy runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prepare exact curl-cffi Android wheel and wheel-private native companion
        run: |
          set -euo pipefail
          python3 scripts/prepare_curl_cffi_android_wheel.py
          python3 scripts/validate_iteration_v15_curl_cffi_compat.py
          python3 scripts/prepare_curl_cffi_native_companion_v16.py | tee /tmp/v16-native-prep.log
          grep -F "required companion: $PRIVATE_CURL_LIB" /tmp/v16-native-prep.log
          test -s "android/app/src/main/jniLibs/arm64-v8a/$PRIVATE_CURL_LIB"
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          p = Path('android/app/src/main/jniLibs/arm64-v8a') / os.environ['PRIVATE_CURL_LIB']
          data = p.read_bytes()
          assert data.startswith(b'\x7fELF')
          print('curl-cffi private companion SHA-256:', hashlib.sha256(data).hexdigest())
          print('curl-cffi private companion size:', len(data))
          PY

      - name: Setup Gradle 8.4 for final no-APK dependency gate
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Resolve exact ARM64 Android Python requirements one final time before APK build
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_BIN="$(command -v flutter)"
          FLUTTER_SDK="$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          cat > android/local.properties <<EOF
          sdk.dir=$SDK_ROOT
          flutter.sdk=$FLUTTER_SDK
          flutter.versionName=$BUILD_NAME
          flutter.versionCode=$BUILD_NUMBER
          EOF
          gradle -p android :app:generateDebugPythonRequirements --no-daemon 2>&1 | tee /tmp/v16-release-python-resolution.log
          verify_dep() {
            local pattern="$1"
            if grep -Eiq "$pattern" /tmp/v16-release-python-resolution.log; then return 0; fi
            if find android/app/build -print 2>/dev/null | grep -Eiq "$pattern"; then return 0; fi
            echo "Required Android Python dependency was not resolved: $pattern" >&2
            exit 1
          }
          verify_dep 'curl[_-]cffi.*0\.16\.2|curl[_-]cffi-0\.16\.2'
          verify_dep 'cffi.*1\.17\.1|cffi-1\.17\.1'
          verify_dep 'matplotlib.*3\.8\.4|matplotlib-3\.8\.4'
          verify_dep 'pandas.*2\.1\.3|pandas-2\.1\.3'
          verify_dep 'numpy.*1\.26\.2|numpy-1\.26\.2'
          test -s "android/app/src/main/jniLibs/arm64-v8a/$PRIVATE_CURL_LIB"

      - name: Restore exact known-good MLC runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 3 -o upstream-known-good.apk "$SOURCE_APK_URL"
          echo "$SOURCE_APK_SHA256  upstream-known-good.apk" | sha256sum -c -
          test "$(stat -c '%s' upstream-known-good.apk)" -eq 593655513
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          src = pathlib.Path('upstream-known-good.apk')
          dst = pathlib.Path('android/mlc4j/output/arm64-v8a/libtvm4j_runtime_packed.so')
          dst.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(src) as z:
              data = z.read('lib/arm64-v8a/libtvm4j_runtime_packed.so')
          assert len(data) == 38786520, len(data)
          digest = hashlib.sha256(data).hexdigest()
          assert digest == '5a3bb01f0819e85c07f58602161f6d020ecbf3e7f65922c9dfe898cfa0820c48', digest
          dst.write_bytes(data)
          print('Restored verified MLC runtime:', digest)
          PY

      - name: Restore stable signing identity and enforce one ARM64 build configuration
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/signing/rastacoder-dev-keystore.p12.b64 | base64 -d > android/app/rastacoder-dev.p12
          test "$(sha256sum android/app/rastacoder-dev.p12 | awk '{print $1}')" = "7048dea7d7152b80255716de2338eea539acd898cc3b8ecf8a9ca2203f21b169"
          cat > android/key.properties <<'EOF'
          storeFile=rastacoder-dev.p12
          storePassword=RastaCoderDev2026!
          keyAlias=rastacoder-dev
          keyPassword=RastaCoderDev2026!
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          text = p.read_text()
          text = text.replace('abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"', 'abiFilters "arm64-v8a"')
          start = text.find('        debug {')
          end = text.find('        release {', start)
          if start < 0 or end < 0:
              raise SystemExit('debug/release buildTypes not found')
          block = text[start:end]
          signing = "            signingConfig keystoreProperties.containsKey('storeFile') ? signingConfigs.release : signingConfigs.debug\n"
          lines = [line for line in block.splitlines(True) if 'signingConfig keystoreProperties.containsKey' not in line]
          rebuilt = ''.join(lines)
          anchor = '            buildConfigField "boolean", "NAVIXMIND_DEBUG", "true"\n'
          if anchor not in rebuilt:
              raise SystemExit('debug signing anchor not found')
          rebuilt = rebuilt.replace(anchor, anchor + signing, 1)
          text = text[:start] + rebuilt + text[end:]
          p.write_text(text)
          PY

      - name: Build the single final stable-signed ARM64 V16 APK
        run: |
          set -euo pipefail
          flutter build apk --debug --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          cp build/app/outputs/flutter-apk/app-debug.apk "$OUTPUT_APK"
          test -s "$OUTPUT_APK"

      - name: Verify final V16 APK package signature ABI runtimes and regressions
        id: verify_release
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            sdkmanager 'build-tools;35.0.0' >/dev/null
            APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          fi
          AAPT="$(dirname "$APKSIGNER")/aapt"
          BADGING="$($AAPT dump badging "$OUTPUT_APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -F "package: name='$EXPECTED_PACKAGE'"
          echo "$BADGING" | grep -F "versionCode='$BUILD_NUMBER'"
          echo "$BADGING" | grep -F "versionName='$BUILD_NAME'"
          "$APKSIGNER" verify --verbose --print-certs "$OUTPUT_APK" | tee apksigner.txt
          CERT_SHA="$(awk -F': ' '/certificate SHA-256 digest/{print tolower($NF); exit}' apksigner.txt | tr -d ':')"
          test "$CERT_SHA" = "$EXPECTED_CERT_SHA256"
          python3 - <<'PY'
          import hashlib, os, zipfile
          from pathlib import Path
          apk = os.environ['OUTPUT_APK']
          with zipfile.ZipFile(apk) as z:
              names = z.namelist()
              abis = sorted({n.split('/')[1] for n in names if n.startswith('lib/') and len(n.split('/')) >= 3})
              assert abis == ['arm64-v8a'], abis
              runtime_name = 'lib/arm64-v8a/libtvm4j_runtime_packed.so'
              runtime = z.read(runtime_name)
              assert len(runtime) == 38786520, len(runtime)
              runtime_sha = hashlib.sha256(runtime).hexdigest()
              assert runtime_sha == os.environ['EXPECTED_RUNTIME_SHA256'], runtime_sha
              private_name = 'lib/arm64-v8a/' + os.environ['PRIVATE_CURL_LIB']
              assert private_name in names, private_name
              packed_private = z.read(private_name)
              source_private = (Path('android/app/src/main/jniLibs/arm64-v8a') / os.environ['PRIVATE_CURL_LIB']).read_bytes()
              assert packed_private == source_private, 'curl-cffi native companion bytes changed during packaging'
              assert packed_private.startswith(b'\x7fELF')
              print('Verified APK curl-cffi companion SHA-256:', hashlib.sha256(packed_private).hexdigest())
          PY
          python3 -m pip install -q \
            anthropic requests beautifulsoup4 lxml pypdf reportlab \
            python-docx python-pptx openpyxl Pillow yt-dlp \
            'numpy<2' 'pandas<3' 'matplotlib<4'
          python3 scripts/run_validate_iteration_v9.py
          python3 scripts/validate_iteration_v10.py
          python3 scripts/validate_iteration_v11.py
          python3 scripts/validate_iteration_v12.py
          python3 scripts/validate_iteration_v13.py
          python3 scripts/validate_iteration_v14.py
          python3 scripts/validate_iteration_v15.py
          python3 scripts/validate_iteration_v15_curl_cffi_compat.py
          python3 scripts/validate_iteration_v16.py
          OUT_SHA="$(sha256sum "$OUTPUT_APK" | awk '{print $1}')"
          OUT_SIZE="$(stat -c '%s' "$OUTPUT_APK")"
          PRIVATE_SHA="$(sha256sum "android/app/src/main/jniLibs/arm64-v8a/$PRIVATE_CURL_LIB" | awk '{print $1}')"
          echo "out_sha=$OUT_SHA" >> "$GITHUB_OUTPUT"
          echo "out_size=$OUT_SIZE" >> "$GITHUB_OUTPUT"
          echo "cert_sha=$CERT_SHA" >> "$GITHUB_OUTPUT"
          echo "private_sha=$PRIVATE_SHA" >> "$GITHUB_OUTPUT"
          echo "Final APK SHA-256: $OUT_SHA"
          echo "Final APK size: $OUT_SIZE"

      - name: Persist verified V16 generated source and handoff
        env:
          OUT_SHA: ${{ steps.verify_release.outputs.out_sha }}
          OUT_SIZE: ${{ steps.verify_release.outputs.out_size }}
          PRIVATE_SHA: ${{ steps.verify_release.outputs.private_sha }}
        run: |
          set -euo pipefail
          rm -f android/app/rastacoder-dev.p12 android/key.properties android/local.properties upstream-known-good.apk
          rm -rf android/app/vendor
          rm -f "android/app/src/main/jniLibs/arm64-v8a/$PRIVATE_CURL_LIB"
          cat > docs/HANDOFF_QWEN3_RESIDUAL_RUNTIME_HARDENING_V16.md <<EOF
          # RastaCoder Qwen3 Residual Runtime Hardening v16 — verified release handoff

          Branch: \`iteration/qwen3-residual-runtime-hardening-v16\`
          Release tag: \`$RELEASE_TAG\`
          Version: \`$BUILD_NAME\` / code \`$BUILD_NUMBER\`
          Package: \`$EXPECTED_PACKAGE\`
          Full no-APK preflight: \`$PREFLIGHT_RUN\`
          MLC/native binary probe: \`$RUNTIME_PROBE_RUN\`

          ## V16 verified fixes
          - Preserves exactly 25 manually controlled Skills / 37 canonical local functions and all V9-V15 safeguards.
          - Safe Python os.path facade now provides exists/isfile/isdir/getsize/getmtime inside OUTPUT_DIR while arbitrary filesystem probing remains blocked.
          - create_xlsx normalizes canonical 2-D rows, compatibility sheet_name/data/item payloads, and object-record rows to one matrix representation; it reopens saved workbooks and verifies cell values before reporting success.
          - download_media now packages every wheel-private hashed native dependency required by the pinned official curl-cffi Android ARM64 wheel; native import/dlopen failures also return an explicit browser-impersonation-runtime diagnostic.
          - The packaged curl-cffi private companion \`$PRIVATE_CURL_LIB\` is byte-identical to the pinned wheel payload; SHA-256 \`$PRIVATE_SHA\`.

          ## MLC model compatibility audit
          - Current fixed runtime was binary-probed and contains exactly the five model_lib IDs already represented by the download list.
          - No unverified MLC model was added in V16. Future expansion requires compiling its model library into the Android MLC runtime and passing real-device load/inference/tool-use acceptance tests before it enters the list.

          ## Final verified artifact
          - ABI: \`arm64-v8a\` only
          - Stable signing certificate SHA-256: \`$EXPECTED_CERT_SHA256\`
          - MLC runtime SHA-256: \`$EXPECTED_RUNTIME_SHA256\`
          - APK SHA-256: \`$OUT_SHA\`
          - APK size: \`$OUT_SIZE\` bytes
          EOF

          cat > docs/V16_LIVE_PROGRESS_AND_HANDOFF.md <<EOF
          # RastaCoder V16 live progress and handoff

          - Complete V9-V16 no-APK preflight \`$PREFLIGHT_RUN\`: SUCCESS.
          - Exact MLC/native binary probe \`$RUNTIME_PROBE_RUN\`: SUCCESS.
          - 25 Skills / 37 canonical local functions preserved.
          - Safe os.path, XLSX create/read roundtrip, and curl-cffi Android native companion fixes are covered by V16 regression gates.
          - Flutter static analysis and exact Chaquopy ARM64 dependency resolution passed before the single formal APK build.
          - Current MLC runtime is proven to support exactly the five existing download-list model_lib IDs; V16 intentionally adds no speculative model entries.
          - Verified APK SHA-256: \`$OUT_SHA\`.
          - Verified APK size: \`$OUT_SIZE\` bytes.
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add docs/HANDOFF_QWEN3_RESIDUAL_RUNTIME_HARDENING_V16.md docs/V16_LIVE_PROGRESS_AND_HANDOFF.md
          if ! git diff --cached --quiet; then
            git commit -m 'feat: persist verified residual runtime hardening v16 source and handoff [skip ci]'
            git push origin HEAD:iteration/qwen3-residual-runtime-hardening-v16
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_SHA: ${{ steps.verify_release.outputs.out_sha }}
          OUT_SIZE: ${{ steps.verify_release.outputs.out_size }}
          CERT_SHA: ${{ steps.verify_release.outputs.cert_sha }}
          PRIVATE_SHA: ${{ steps.verify_release.outputs.private_sha }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          RastaCoder Qwen3 4B Residual Runtime Hardening v16

          Version: $BUILD_NAME ($BUILD_NUMBER)
          Package: $EXPECTED_PACKAGE
          ABI: arm64-v8a only
          APK SHA-256: $OUT_SHA
          APK size: $OUT_SIZE bytes
          Signing certificate SHA-256: $CERT_SHA
          MLC runtime SHA-256: $EXPECTED_RUNTIME_SHA256
          curl-cffi private native companion: $PRIVATE_CURL_LIB
          curl-cffi private companion SHA-256: $PRIVATE_SHA

          V16 closes the three residual issues from the cloud-model regression: safe os.path exists/isfile/isdir/getsize/getmtime support inside OUTPUT_DIR, robust create_xlsx/read_xlsx roundtrips across canonical and compatibility payload structures, and Android packaging of curl-cffi's wheel-private native dependency so download_media can enter its browser-impersonation path on-device. It preserves the previous 25 Skills / 37 canonical functions and all V9-V15 safeguards.

          The current fixed MLC runtime was binary-audited and contains exactly the five model_lib IDs already exposed by the existing local-model download list. V16 therefore adds no speculative model entries; additional models require a separately compiled MLC runtime plus real-device acceptance tests.

          Full no-APK preflight: https://github.com/${GITHUB_REPOSITORY}/actions/runs/$PREFLIGHT_RUN
          MLC/native binary probe: https://github.com/${GITHUB_REPOSITORY}/actions/runs/$RUNTIME_PROBE_RUN
          EOF
          gh release create "$RELEASE_TAG" "$OUTPUT_APK" \
            --target iteration/qwen3-residual-runtime-hardening-v16 \
            --title 'RastaCoder Qwen3 4B Residual Runtime Hardening v16' \
            --notes-file release-notes.md

      - name: Cleanup signing and generated native/vendor materials
        if: always()
        run: |
          rm -f android/app/rastacoder-dev.p12 android/key.properties android/local.properties upstream-known-good.apk
          rm -rf android/app/vendor
          rm -f "android/app/src/main/jniLibs/arm64-v8a/$PRIVATE_CURL_LIB"
