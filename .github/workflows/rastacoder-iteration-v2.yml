name: Build RastaCoder Skills Parameters Stream v5

on:
  push:
    branches:
      - iteration/qwen3-cn-ui-live-tools-google
    paths:
      - '.github/workflows/rastacoder-iteration-v2.yml'
      - 'scripts/apply_iteration_v2.py'
      - 'scripts/apply_iteration_v2_stage2.py'
      - 'scripts/apply_iteration_v2_stage3.py'
      - 'scripts/apply_iteration_v4_tools.py'
      - 'scripts/apply_iteration_v4_android.py'
      - 'scripts/apply_iteration_v5.py'
      - 'scripts/v5_payload_*.b64'
      - 'scripts/validate_iteration_v5.py'
      - 'python/navixmind/**'
      - 'ITERATION_V2_TRIGGER.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build, verify v5 ARM64 update, and release APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      BASELINE_COMMIT: e165c311eb464722c5db0883426e82af69468330
      SOURCE_APK_URL: https://github.com/alexandertaboriskiy/navixmind/releases/download/v0.5.0-beta/app-debug.apk
      SOURCE_APK_SHA256: 94f574560ec469772021e284a12eabb71211393d25388c6669d854d58810a8ed
      EXPECTED_RUNTIME_SHA256: 5a3bb01f0819e85c07f58602161f6d020ecbf3e7f65922c9dfe898cfa0820c48
      EXPECTED_CERT_SHA256: 87d560a2d8f7a7c7fb8fd66b40ac6a40fb8f210a4f436fa468ecbbaa5b6170b8
      EXPECTED_PACKAGE: ai.navixmind
      BUILD_NAME: 0.0.4
      BUILD_NUMBER: '18'
      OUTPUT_APK: RastaCoder-Qwen3-4B-skills-params-stream-v5-update.apk
      RELEASE_TAG: qwen3-skills-params-stream-v5

    steps:
      - name: Checkout iteration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Restore clean known-good application source
        shell: bash
        run: |
          set -euo pipefail
          # Rebuild the Flutter application layer from the known-good upstream
          # baseline, then deterministically replay every RastaCoder patch.
          git checkout "$BASELINE_COMMIT" -- lib android/app/build.gradle
          grep -F 'applicationId "ai.navixmind"' android/app/build.gradle
          echo 'Restored clean known-good application source from' "$BASELINE_COMMIT"

      - name: Apply RastaCoder v2 through v5 patches
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_iteration_v2.py
          python3 scripts/apply_iteration_v2_stage2.py
          python3 scripts/apply_iteration_v2_stage3.py
          python3 scripts/apply_iteration_v4_tools.py
          python3 scripts/apply_iteration_v4_android.py
          python3 scripts/apply_iteration_v5.py

          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          text = p.read_text()
          text = text.replace('    id "com.google.gms.google-services"\n', '')
          text = text.replace('    id "com.firebase.crashlytics"\n', '')
          text = text.replace('    id "com.google.firebase.crashlytics"\n', '')
          p.write_text(text)
          PY

          grep -F 'abiFilters "arm64-v8a"' android/app/build.gradle
          grep -F 'RASTACODER_V4_TOOL_CONTRACT' python/navixmind/agent.py
          grep -F 'RASTACODER_V5_SKILLS_PARAMS_BENCH_STREAM' python/navixmind/agent.py
          grep -F '[MODEL_TOOL_DISABLED]' python/navixmind/tools/__init__.py
          grep -F "generation_started" android/app/src/main/kotlin/ai/navixmind/services/MLCInferenceChannel.kt

      - name: Verify v5 invariants and original-tool coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_iteration_v5.py

      - name: Validate Python sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            python/navixmind/agent.py \
            python/navixmind/session.py \
            python/navixmind/tools/__init__.py \
            python/navixmind/tools/documents.py \
            python/navixmind/tools/google_api.py \
            python/navixmind/tools/compat.py

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Align inappwebview Android library compile SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          pub = Path(os.environ['PUB_CACHE']) / 'hosted' / 'pub.dev'
          candidates = sorted(pub.glob('flutter_inappwebview_android-*/android/build.gradle'))
          if not candidates:
              raise SystemExit('flutter_inappwebview_android build.gradle not found')
          p = candidates[-1]
          text = p.read_text()
          original = text
          replacements = {
              'compileSdkVersion 33': 'compileSdkVersion 35',
              'compileSdkVersion 34': 'compileSdkVersion 35',
              'compileSdk 33': 'compileSdk 35',
              'compileSdk 34': 'compileSdk 35',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          if text == original:
              print('No compileSdk replacement needed; current file follows root SDK configuration')
          else:
              p.write_text(text)
              print('Patched', p, 'to compileSdk 35')
          PY

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Download exact known-good APK and restore MLC runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 3 -o upstream-known-good.apk "$SOURCE_APK_URL"
          echo "$SOURCE_APK_SHA256  upstream-known-good.apk" | sha256sum -c -
          test "$(stat -c '%s' upstream-known-good.apk)" -eq 593655513

          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          src = pathlib.Path('upstream-known-good.apk')
          dst = pathlib.Path('android/mlc4j/output/arm64-v8a/libtvm4j_runtime_packed.so')
          dst.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(src) as z:
              data = z.read('lib/arm64-v8a/libtvm4j_runtime_packed.so')
          assert len(data) == 38786520, len(data)
          digest = hashlib.sha256(data).hexdigest()
          assert digest == '5a3bb01f0819e85c07f58602161f6d020ecbf3e7f65922c9dfe898cfa0820c48', digest
          dst.write_bytes(data)
          print('Restored verified MLC runtime:', dst, digest)
          PY

      - name: Restore stable RastaCoder signing identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/signing/rastacoder-dev-keystore.p12.b64 | base64 -d > android/app/rastacoder-dev.p12
          test "$(sha256sum android/app/rastacoder-dev.p12 | awk '{print $1}')" = "7048dea7d7152b80255716de2338eea539acd898cc3b8ecf8a9ca2203f21b169"
          cat > android/key.properties <<'EOF'
          storeFile=rastacoder-dev.p12
          storePassword=RastaCoderDev2026!
          keyAlias=rastacoder-dev
          keyPassword=RastaCoderDev2026!
          EOF

          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('android/app/build.gradle')
          text = p.read_text()
          pattern = re.compile(
              r'(\bdebug\s*\{\s*\n\s*buildConfigField\s+"boolean",\s*"NAVIXMIND_DEBUG",\s*"true"\s*\n)',
              re.MULTILINE,
          )
          replacement = r"\1            signingConfig keystoreProperties.containsKey('storeFile') ? signingConfigs.release : signingConfigs.debug\n"
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one debug buildType anchor, found {count}')
          p.write_text(text)
          print('Configured stable project signing for upgrade build')
          PY

      - name: Build signed ARM64 in-place update APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          cp build/app/outputs/flutter-apk/app-debug.apk "$OUTPUT_APK"

      - name: Verify package, version, ARM64 ABI, signature and Qwen3 runtime
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            sdkmanager 'build-tools;35.0.0' >/dev/null
            APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          fi
          AAPT="$(dirname "$APKSIGNER")/aapt"
          test -x "$AAPT"

          BADGING="$($AAPT dump badging "$OUTPUT_APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -F "package: name='$EXPECTED_PACKAGE'"
          echo "$BADGING" | grep -F "versionCode='$BUILD_NUMBER'"
          echo "$BADGING" | grep -F "versionName='$BUILD_NAME'"

          "$APKSIGNER" verify --verbose --print-certs "$OUTPUT_APK" | tee apksigner.txt
          CERT_SHA="$(awk -F': ' '/certificate SHA-256 digest/{print tolower($NF); exit}' apksigner.txt | tr -d ':')"
          test "$CERT_SHA" = "$EXPECTED_CERT_SHA256"

          python3 - <<'PY'
          import hashlib, os, zipfile
          apk = os.environ['OUTPUT_APK']
          with zipfile.ZipFile(apk) as z:
              names = z.namelist()
              abis = sorted({
                  n.split('/')[1]
                  for n in names
                  if n.startswith('lib/') and len(n.split('/')) >= 3
              })
              print('Native ABIs packaged:', abis)
              assert abis == ['arm64-v8a'], f'APK is not ARM64-only: {abis}'
              assert not any(n.startswith('lib/armeabi-v7a/') for n in names)
              assert not any(n.startswith('lib/x86_64/') for n in names)
              matches = [n for n in names if n == 'lib/arm64-v8a/libtvm4j_runtime_packed.so']
              assert matches, 'arm64 MLC runtime missing from built APK'
              data = z.read(matches[0])
              assert len(data) == 38786520, len(data)
              digest = hashlib.sha256(data).hexdigest()
              assert digest == '5a3bb01f0819e85c07f58602161f6d020ecbf3e7f65922c9dfe898cfa0820c48', digest
              assert any('flutter_assets' in n for n in names), 'Flutter assets missing'
              print('Verified runtime:', matches[0], digest)
          PY

          # Re-run source contract validation immediately before release so the
          # published APK is tied to a build where all original local tools are covered.
          python3 scripts/validate_iteration_v5.py

          OUT_SHA="$(sha256sum "$OUTPUT_APK" | awk '{print $1}')"
          OUT_SIZE="$(stat -c '%s' "$OUTPUT_APK")"
          echo "out_sha=$OUT_SHA" >> "$GITHUB_OUTPUT"
          echo "out_size=$OUT_SIZE" >> "$GITHUB_OUTPUT"
          echo "cert_sha=$CERT_SHA" >> "$GITHUB_OUTPUT"

      - name: Persist final v5 patched source on iteration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib android/app/build.gradle android/app/src/main/kotlin python/navixmind
          if ! git diff --cached --quiet; then
            git commit -m 'feat: persist skills parameters stream v5 source [skip ci]'
            git push origin HEAD:iteration/qwen3-cn-ui-live-tools-google
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_SHA: ${{ steps.verify.outputs.out_sha }}
          OUT_SIZE: ${{ steps.verify.outputs.out_size }}
          CERT_SHA: ${{ steps.verify.outputs.cert_sha }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          RastaCoder Qwen3 4B Skills / Parameters / Stream v5 — in-place ARM64 update APK.

          Upgrade compatibility verified during CI:
          - package/applicationId: $EXPECTED_PACKAGE
          - Android versionCode: $BUILD_NUMBER
          - versionName: $BUILD_NAME
          - signing certificate SHA-256: $CERT_SHA (same stable RastaCoder certificate)
          - known-good Qwen3 4B MLC runtime byte-verified
          - native APK ABI verified as arm64-v8a only

          v5 modules:
          - Adds 21 manually controlled Skill categories. There is no automatic Skill selection.
          - Programmatic coverage gate proves the 21 Skills collectively cover all 23 original local tool functions with zero loss; shared functions are de-duplicated at schema injection.
          - Enabled Skills dynamically control which local tool schemas/prompts are injected, with an execution-layer allowed-tool boundary as a second safeguard.
          - Skill selection and Thinking Mode are independent. Thinking remains explicitly user controlled: model default / enabled / disabled.
          - Adds precise local model settings for temperature, Top P, context budget and maximum output tokens. Token budgets use integer text fields with Token units, not sliders or K presets.
          - Fixes the old local max-output hard cap path and wires the explicit local context budget into conversation retrieval.
          - Adds local benchmark metrics including prefill/decode speed, TTFT, end-to-end latency, token counts and memory measurements.
          - Benchmark results can be saved and the current result can be copied directly to the clipboard.
          - Adds MLC inference event streaming for generation start, first token, thinking state, tool-call state and completion timing without exposing hidden thinking text.
          - Preserves v4 document conversion, DOCX creation, multimedia fixes, Google diagnostics, small-model tool-call compatibility, Chinese UI and collapsed reasoning behavior.

          Verification:
          - APK: $OUTPUT_APK
          - APK SHA-256: $OUT_SHA
          - APK size: $OUT_SIZE bytes
          - MLC runtime SHA-256: $EXPECTED_RUNTIME_SHA256
          - v5 source/coverage validator passed both before build and immediately before release
          EOF

          gh release delete "$RELEASE_TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$RELEASE_TAG" "$OUTPUT_APK" \
            --target iteration/qwen3-cn-ui-live-tools-google \
            --title 'RastaCoder Qwen3 4B Skills Parameters Stream v5' \
            --notes-file release-notes.md
