name: Release RastaCoder Complete Skills v7

on:
  push:
    branches:
      - iteration/qwen3-complete-skills-v7
    paths:
      - '.github/workflows/v7-release.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  V6_TAG: qwen3-tool-reliability-history-v6
  SOURCE_APK_URL: https://github.com/alexandertaboriskiy/navixmind/releases/download/v0.5.0-beta/app-debug.apk
  SOURCE_APK_SHA256: 94f574560ec469772021e284a12eabb71211393d25388c6669d854d58810a8ed
  EXPECTED_RUNTIME_SHA256: 5a3bb01f0819e85c07f58602161f6d020ecbf3e7f65922c9dfe898cfa0820c48
  EXPECTED_CERT_SHA256: 87d560a2d8f7a7c7fb8fd66b40ac6a40fb8f210a4f436fa468ecbbaa5b6170b8
  EXPECTED_PACKAGE: ai.navixmind
  BUILD_NAME: 0.0.6
  BUILD_NUMBER: '20'
  OUTPUT_APK: RastaCoder-Qwen3-4B-complete-skills-accessibility-v7-update.apk
  RELEASE_TAG: qwen3-complete-skills-accessibility-v7

jobs:
  release-v7:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout v7 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Restore exact released v6 functional source
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL_V7_SHA="$GITHUB_SHA"
          git fetch --tags --force
          git rev-parse "$V6_TAG"
          git checkout "$V6_TAG" -- lib python/navixmind android/app/build.gradle android/app/src/main/kotlin/ai/navixmind/services/MLCInferenceChannel.kt
          # extended_tools is a new v7 source file and does not exist in v6.
          git checkout "$ORIGINAL_V7_SHA" -- python/navixmind/tools/extended_tools.py

          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          text = p.read_text()
          text = text.replace('    id "com.google.gms.google-services"\n', '')
          text = text.replace('    id "com.firebase.crashlytics"\n', '')
          text = text.replace('    id "com.google.firebase.crashlytics"\n', '')
          text = text.replace('abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"', 'abiFilters "arm64-v8a"')
          p.write_text(text)
          PY
          grep -F 'applicationId "ai.navixmind"' android/app/build.gradle
          grep -F 'abiFilters "arm64-v8a"' android/app/build.gradle

      - name: Prove released v6 reliability baseline before v7 expansion
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_iteration_v6.py
          python3 scripts/validate_iteration_v6_extended.py
          python3 scripts/validate_iteration_v6_deep.py

      - name: Apply complete reviewed v7 patch chain
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run_iteration_v7_tools.py
          python3 scripts/apply_iteration_v7_native.py
          python3 scripts/apply_iteration_v7_ui.py
          python3 scripts/apply_iteration_v7_accessibility2.py
          python3 scripts/apply_iteration_v7_preoffice.py
          python3 scripts/apply_iteration_v7_office.py
          python3 scripts/apply_iteration_v7_archive.py
          python3 scripts/apply_iteration_v7_media.py
          python3 scripts/apply_iteration_v7_pathing.py

      - name: Compile Python and install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            python/navixmind/agent.py \
            python/navixmind/session.py \
            python/navixmind/tools/__init__.py \
            python/navixmind/tools/compat.py \
            python/navixmind/tools/documents.py \
            python/navixmind/tools/media.py \
            python/navixmind/tools/google_api.py \
            python/navixmind/tools/extended_tools.py
          python3 -m pip install --upgrade pip
          python3 -m pip install requests beautifulsoup4 lxml pypdf reportlab python-docx python-pptx openpyxl Pillow yt-dlp numpy pandas matplotlib

      - name: Run final v7 systemic and functional validation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_iteration_v7.py
          grep -F 'RASTACODER_V7_COMPLETE_SKILLS' lib/core/models/tool_skill.dart
          grep -F 'RASTACODER_V7_LOCAL_MODEL_RESTORE' lib/main.dart
          grep -F 'class _AccessibleExpansionSection extends StatefulWidget' lib/features/chat/presentation/widgets/message_bubble.dart

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Align inappwebview Android library compile SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          pub = Path(os.environ['PUB_CACHE']) / 'hosted' / 'pub.dev'
          candidates = sorted(pub.glob('flutter_inappwebview_android-*/android/build.gradle'))
          if not candidates:
              raise SystemExit('flutter_inappwebview_android build.gradle not found')
          p = candidates[-1]
          text = p.read_text()
          for old, new in {
              'compileSdkVersion 33': 'compileSdkVersion 35',
              'compileSdkVersion 34': 'compileSdkVersion 35',
              'compileSdk 33': 'compileSdk 35',
              'compileSdk 34': 'compileSdk 35',
          }.items():
              text = text.replace(old, new)
          p.write_text(text)
          PY

      - name: Flutter static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Restore exact known-good MLC runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 3 -o upstream-known-good.apk "$SOURCE_APK_URL"
          echo "$SOURCE_APK_SHA256  upstream-known-good.apk" | sha256sum -c -
          test "$(stat -c '%s' upstream-known-good.apk)" -eq 593655513
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          src = pathlib.Path('upstream-known-good.apk')
          dst = pathlib.Path('android/mlc4j/output/arm64-v8a/libtvm4j_runtime_packed.so')
          dst.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(src) as z:
              data = z.read('lib/arm64-v8a/libtvm4j_runtime_packed.so')
          assert len(data) == 38786520, len(data)
          digest = hashlib.sha256(data).hexdigest()
          assert digest == '5a3bb01f0819e85c07f58602161f6d020ecbf3e7f65922c9dfe898cfa0820c48', digest
          dst.write_bytes(data)
          print('Restored verified MLC runtime:', digest)
          PY

      - name: Restore stable RastaCoder signing identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/signing/rastacoder-dev-keystore.p12.b64 | base64 -d > android/app/rastacoder-dev.p12
          test "$(sha256sum android/app/rastacoder-dev.p12 | awk '{print $1}')" = "7048dea7d7152b80255716de2338eea539acd898cc3b8ecf8a9ca2203f21b169"
          cat > android/key.properties <<'EOF'
          storeFile=rastacoder-dev.p12
          storePassword=RastaCoderDev2026!
          keyAlias=rastacoder-dev
          keyPassword=RastaCoderDev2026!
          EOF
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('android/app/build.gradle')
          text = p.read_text()
          pattern = re.compile(
              r'(\bdebug\s*\{\s*\n\s*buildConfigField\s+"boolean",\s*"NAVIXMIND_DEBUG",\s*"true"\s*\n)',
              re.MULTILINE,
          )
          if 'signingConfig keystoreProperties.containsKey' not in text[text.find('debug {'):text.find('release {')]:
              text, count = pattern.subn(
                  r"\1            signingConfig keystoreProperties.containsKey('storeFile') ? signingConfigs.release : signingConfigs.debug\n",
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'Expected one debug buildType anchor, found {count}')
          text = text.replace('abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"', 'abiFilters "arm64-v8a"')
          p.write_text(text)
          PY

      - name: Build one final stable-signed ARM64 v7 APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          cp build/app/outputs/flutter-apk/app-debug.apk "$OUTPUT_APK"
          test -s "$OUTPUT_APK"

      - name: Verify final v7 APK package signature ABI runtime and tool gates
        id: verify_release
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            sdkmanager 'build-tools;35.0.0' >/dev/null
            APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          fi
          AAPT="$(dirname "$APKSIGNER")/aapt"
          test -x "$AAPT"
          BADGING="$($AAPT dump badging "$OUTPUT_APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -F "package: name='$EXPECTED_PACKAGE'"
          echo "$BADGING" | grep -F "versionCode='$BUILD_NUMBER'"
          echo "$BADGING" | grep -F "versionName='$BUILD_NAME'"
          "$APKSIGNER" verify --verbose --print-certs "$OUTPUT_APK" | tee apksigner.txt
          CERT_SHA="$(awk -F': ' '/certificate SHA-256 digest/{print tolower($NF); exit}' apksigner.txt | tr -d ':')"
          test "$CERT_SHA" = "$EXPECTED_CERT_SHA256"
          python3 - <<'PY'
          import hashlib, os, zipfile
          apk = os.environ['OUTPUT_APK']
          with zipfile.ZipFile(apk) as z:
              names = z.namelist()
              abis = sorted({n.split('/')[1] for n in names if n.startswith('lib/') and len(n.split('/')) >= 3})
              print('Native ABIs packaged:', abis)
              assert abis == ['arm64-v8a'], f'APK is not ARM64-only: {abis}'
              runtime = 'lib/arm64-v8a/libtvm4j_runtime_packed.so'
              assert runtime in names, 'arm64 MLC runtime missing'
              data = z.read(runtime)
              assert len(data) == 38786520, len(data)
              digest = hashlib.sha256(data).hexdigest()
              assert digest == os.environ['EXPECTED_RUNTIME_SHA256'], digest
              assert any('flutter_assets' in n for n in names), 'Flutter assets missing'
              print('Verified MLC runtime:', digest)
          PY
          python3 scripts/validate_iteration_v7.py
          OUT_SHA="$(sha256sum "$OUTPUT_APK" | awk '{print $1}')"
          OUT_SIZE="$(stat -c '%s' "$OUTPUT_APK")"
          echo "out_sha=$OUT_SHA" >> "$GITHUB_OUTPUT"
          echo "out_size=$OUT_SIZE" >> "$GITHUB_OUTPUT"
          echo "cert_sha=$CERT_SHA" >> "$GITHUB_OUTPUT"
          echo "Final APK SHA-256: $OUT_SHA"
          echo "Final APK size: $OUT_SIZE"

      - name: Persist verified v7 source and handoff
        env:
          OUT_SHA: ${{ steps.verify_release.outputs.out_sha }}
          OUT_SIZE: ${{ steps.verify_release.outputs.out_size }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f android/app/rastacoder-dev.p12 android/key.properties
          cat > docs/HANDOFF_QWEN3_COMPLETE_SKILLS_V7.md <<EOF
          # RastaCoder Qwen3 Complete Skills v7 — verified release handoff

          Current branch: \`iteration/qwen3-complete-skills-v7\`
          Release tag: \`$RELEASE_TAG\`
          Version: \`$BUILD_NAME\` / code \`$BUILD_NUMBER\`

          ## User-verified v6 starting point
          V6 real-device testing confirmed the repaired local Qwen3-4B tool chain successfully executed document-format conversion, autonomous TXT/Word creation, and audio-format conversion. V7 preserves that reliability architecture and expands the capability surface.

          ## V7 systemic changes
          - 21 Skills remain manually selected to control local-model context size.
          - The obsolete “23 original tools = complete” invariant is removed. V7 covers 31 canonical local functions: the legacy 23, upstream post-baseline \`image_compose\` and \`list_files\`, plus six new structured functions for complete file/archive/PDF/Office coverage.
          - File/text operations now include list/discover, mkdir, copy, move, rename, delete, touch and existence checks.
          - ZIP supports directory-aware creation, archive listing and safe extraction.
          - Image processing supports resize/upscale/downscale, format conversion, concat, overlay, crop, adjust, grayscale, blur, rotate, flip and smart face crop.
          - FFmpeg keeps the advanced custom escape hatch and adds structured multi-input concat, audio mixing and video/audio merge.
          - PDF adds merge/split/extract/reorder/delete/rotate page management.
          - PowerPoint and Excel can now be created; Office modification actions are expanded.
          - Media download now saves the resolved media file instead of returning only a URL.
          - Google Calendar adds update; Gmail remains read-only because the app deliberately requests only gmail.readonly.
          - Attached paths are resolved for ZIP/file operations and nested Office image operations.
          - Chat-history and new-conversation buttons have explicit accessibility semantics.
          - Thinking and tool-diagnostics panels are independently focusable stateful expand/collapse controls with dynamic screen-reader labels.
          - Fresh installs default to local Qwen3-4B; the last explicitly selected model is persisted and the preferred downloaded local model is restored into the MLC runtime on cold start. Cloud models remain explicit options.

          ## Verification
          - Final v7 preflight passed Python compilation, functional smoke tests and Flutter Analyze before any APK build.
          - Release build used the exact released v6 functional source as baseline, then the complete v7 patch chain.
          - Final package: \`$EXPECTED_PACKAGE\`
          - Final ABI: \`arm64-v8a\` only
          - Stable signing certificate SHA-256: \`$EXPECTED_CERT_SHA256\`
          - MLC runtime SHA-256: \`$EXPECTED_RUNTIME_SHA256\`
          - APK SHA-256: \`$OUT_SHA\`
          - APK size: \`$OUT_SIZE\` bytes
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib python/navixmind android/app/build.gradle android/app/src/main/kotlin docs/HANDOFF_QWEN3_COMPLETE_SKILLS_V7.md
          if ! git diff --cached --quiet; then
            git commit -m 'feat: persist verified complete-skills v7 source and handoff [skip ci]'
            git push origin HEAD:iteration/qwen3-complete-skills-v7
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_SHA: ${{ steps.verify_release.outputs.out_sha }}
          OUT_SIZE: ${{ steps.verify_release.outputs.out_size }}
          CERT_SHA: ${{ steps.verify_release.outputs.cert_sha }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          RastaCoder Qwen3 4B Complete Skills + Accessibility v7 — stable-signed ARM64 in-place update.

          This release keeps the v6 tool-call reliability fixes verified on-device and replaces the shallow 23-tool Skill baseline with 21 manually controlled, scene-complete Skills covering 31 canonical local functions.

          Major changes:
          - full file/directory lifecycle: list, mkdir, copy, move, rename, delete, touch, exists;
          - ZIP create/list/extract, including directories;
          - full image editing and format/size conversion;
          - FFmpeg custom plus concat, audio mixing and A/V merge;
          - PDF page management;
          - PPTX/XLSX creation and richer Office editing;
          - actual media file download;
          - persistent local-first model selection and cold-start MLC restore;
          - explicit accessible Chat History/New Conversation buttons;
          - independently focusable, truly expandable Thinking and Tool Diagnostics controls.

          Verified final APK:
          - package: $EXPECTED_PACKAGE
          - versionName/versionCode: $BUILD_NAME / $BUILD_NUMBER
          - signing certificate SHA-256: $CERT_SHA
          - ABI: arm64-v8a only
          - MLC runtime SHA-256: $EXPECTED_RUNTIME_SHA256
          - APK SHA-256: $OUT_SHA
          - APK size: $OUT_SIZE bytes
          EOF
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$RELEASE_TAG" "$OUTPUT_APK" \
            --target iteration/qwen3-complete-skills-v7 \
            --title 'RastaCoder Qwen3 4B Complete Skills + Accessibility v7' \
            --notes-file release-notes.md
