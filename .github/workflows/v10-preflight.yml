name: Preflight RastaCoder Context Safe Search History v10

on:
  push:
    branches:
      - iteration/qwen3-context-safe-search-history-v10
    paths:
      - 'V10_PREFLIGHT_TRIGGER.md'

permissions:
  contents: read

jobs:
  preflight-v10:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout v10 branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile v10 patch before touching source
        run: python3 -m py_compile scripts/apply_iteration_v10_context_safe.py scripts/validate_iteration_v10.py

      - name: Apply reviewed v10 patch
        run: python3 scripts/apply_iteration_v10_context_safe.py

      - name: Compile generated Python source
        run: |
          python3 -m py_compile \
            python/navixmind/agent.py \
            python/navixmind/tools/search_tools.py \
            scripts/validate_iteration_v10.py

      - name: Install validation dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install anthropic requests beautifulsoup4 lxml pypdf reportlab python-docx python-pptx openpyxl Pillow yt-dlp numpy pandas matplotlib

      - name: Preserve all v9 systemic regression gates
        run: python3 scripts/run_validate_iteration_v9.py

      - name: Run exact v10 long-result and history gates
        run: python3 scripts/validate_iteration_v10.py

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Align inappwebview Android library compile SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          pub = Path(os.environ['PUB_CACHE']) / 'hosted' / 'pub.dev'
          candidates = sorted(pub.glob('flutter_inappwebview_android-*/android/build.gradle'))
          if not candidates:
              raise SystemExit('flutter_inappwebview_android build.gradle not found')
          p = candidates[-1]
          text = p.read_text()
          for old, new in {
              'compileSdkVersion 33': 'compileSdkVersion 35',
              'compileSdkVersion 34': 'compileSdkVersion 35',
              'compileSdk 33': 'compileSdk 35',
              'compileSdk 34': 'compileSdk 35',
          }.items():
              text = text.replace(old, new)
          p.write_text(text)
          PY

      - name: Flutter static analysis gate
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Preflight summary
        run: |
          echo 'V10 no-APK preflight passed.'
          echo 'Exa 5-result >7900-char regression at 8192 context passed.'
          echo 'Generic long text, explicit failure recovery, bounded max_tokens continuation, and accessible history opening passed.'
          echo 'All v9 systemic gates remain green.'
