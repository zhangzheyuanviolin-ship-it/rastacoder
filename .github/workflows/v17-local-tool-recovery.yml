name: Preflight RastaCoder Local Tool Recovery v17

on:
  push:
    branches:
      - iteration/qwen3-local-tool-contract-recovery-v17
    paths:
      - 'V17_PREFLIGHT_TRIGGER.md'

permissions:
  contents: read

env:
  RUNTIME_PROBE_RUN: '33041507127'

jobs:
  preflight-v17:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout V17 branch
        uses: actions/checkout@v4

      - name: Verify locked exact MLC native runtime probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUNTIME_PROBE_RUN}" --jq '.conclusion')"
          test "$conclusion" = "success"
          echo "Locked runtime probe: $RUNTIME_PROBE_RUN = $conclusion"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply reviewed V17 local compatibility and trust deltas
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/apply_iteration_v17_local_tool_recovery.py \
            scripts/apply_iteration_v17_prompt_legacy_guard.py \
            scripts/apply_iteration_v17_trusted_path_boundary.py \
            scripts/validate_iteration_v17.py
          python3 scripts/apply_iteration_v17_local_tool_recovery.py
          python3 scripts/apply_iteration_v17_prompt_legacy_guard.py
          python3 scripts/apply_iteration_v17_trusted_path_boundary.py
          python3 -m py_compile \
            python/navixmind/tools/compat.py \
            python/navixmind/tools/path_contract.py \
            python/navixmind/tools/__init__.py \
            python/navixmind/tools/extended_tools.py \
            python/navixmind/agent.py

      - name: Install host test dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install anthropic requests beautifulsoup4 lxml pypdf reportlab python-docx python-pptx openpyxl Pillow yt-dlp 'numpy<2' 'pandas<3' 'matplotlib<4'

      - name: Run V9 through V17 local and host regression gates
        run: |
          set -euo pipefail
          python3 scripts/run_validate_iteration_v9.py
          python3 scripts/validate_iteration_v10.py
          python3 scripts/validate_iteration_v11.py
          python3 scripts/validate_iteration_v12.py
          python3 scripts/validate_iteration_v13.py
          python3 scripts/validate_iteration_v14.py
          python3 scripts/validate_iteration_v15.py
          python3 scripts/validate_iteration_v16.py
          python3 scripts/validate_iteration_v17.py

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Align inappwebview Android library compile SDK
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          pub = Path(os.environ['PUB_CACHE']) / 'hosted' / 'pub.dev'
          candidates = sorted(pub.glob('flutter_inappwebview_android-*/android/build.gradle'))
          if not candidates:
              raise SystemExit('flutter_inappwebview_android build.gradle not found')
          p = candidates[-1]
          text = p.read_text()
          for old, new in {
              'compileSdkVersion 33': 'compileSdkVersion 35',
              'compileSdkVersion 34': 'compileSdkVersion 35',
              'compileSdk 33': 'compileSdk 35',
              'compileSdk 34': 'compileSdk 35',
          }.items():
              text = text.replace(old, new)
          p.write_text(text)
          PY

      - name: Flutter static analysis gate
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prepare exact curl cffi Android wheel and native companion
        run: |
          set -euo pipefail
          python3 scripts/prepare_curl_cffi_android_wheel.py
          python3 scripts/validate_iteration_v15_curl_cffi_compat.py
          python3 scripts/prepare_curl_cffi_native_companion_v16.py | tee /tmp/v17-native-prep.log
          grep -F 'required companion: libc++_shared-d523468d.so' /tmp/v17-native-prep.log
          test -f android/app/src/main/jniLibs/arm64-v8a/libc++_shared-d523468d.so

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Resolve exact ARM64 Android Python requirements without APK
        run: |
          set -euo pipefail
          FLUTTER_BIN="$(command -v flutter)"
          FLUTTER_SDK="$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$SDK_ROOT" "$FLUTTER_SDK" > android/local.properties
          gradle -p android :app:generateDebugPythonRequirements --no-daemon 2>&1 | tee /tmp/v17-python-resolution.log
          verify_dep() {
            local pattern="$1"
            if grep -Eiq "$pattern" /tmp/v17-python-resolution.log; then return 0; fi
            if find android/app/build -print 2>/dev/null | grep -Eiq "$pattern"; then return 0; fi
            echo "Required Android Python dependency was not resolved: $pattern" >&2
            exit 1
          }
          verify_dep 'curl[_-]cffi.*0\.16\.2|curl[_-]cffi-0\.16\.2'
          verify_dep 'cffi.*1\.17\.1|cffi-1\.17\.1'
          verify_dep 'matplotlib.*3\.8\.4|matplotlib-3\.8\.4'
          verify_dep 'pandas.*2\.1\.3|pandas-2\.1\.3'
          verify_dep 'numpy.*1\.26\.2|numpy-1\.26\.2'
          if find . -type f -name '*.apk' -print | grep -q .; then
            echo 'Preflight unexpectedly produced an APK.' >&2
            exit 1
          fi

      - name: Preflight summary
        run: |
          echo 'V17 full no-APK preflight passed.'
          echo 'Exact copied Qwen3 list_files slash-root failure and arbitrary leading-slash family are green.'
          echo 'Existing system paths are rejected unless supplied by the application attachment whitelist.'
          echo 'All shared input, array, destination and output-directory boundaries are covered.'
          echo 'Structured local file/archive/PDF/image/Office ABIs are covered.'
          echo 'Logical result reinjection and manual Skill enforcement are covered.'
          echo '25 local Skills and 37 canonical functions remain exposed.'
          echo 'All inherited V9 through V16 gates remain green.'
