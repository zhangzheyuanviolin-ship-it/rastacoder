name: Release RastaCoder Tool Runtime Hardening v15

on:
  push:
    branches:
      - iteration/qwen3-tool-runtime-hardening-v15
    paths:
      - 'V15_RELEASE_TRIGGER.md'

permissions:
  contents: write

env:
  SOURCE_APK_URL: https://github.com/alexandertaboriskiy/navixmind/releases/download/v0.5.0-beta/app-debug.apk
  SOURCE_APK_SHA256: 94f574560ec469772021e284a12eabb71211393d25388c6669d854d58810a8ed
  EXPECTED_RUNTIME_SHA256: 5a3bb01f0819e85c07f58602161f6d020ecbf3e7f65922c9dfe898cfa0820c48
  EXPECTED_CERT_SHA256: 87d560a2d8f7a7c7fb8fd66b40ac6a40fb8f210a4f436fa468ecbbaa5b6170b8
  EXPECTED_PACKAGE: ai.navixmind
  BUILD_NAME: 0.0.14
  BUILD_NUMBER: '28'
  OUTPUT_APK: RastaCoder-Qwen3-4B-tool-runtime-hardening-v15-update.apk
  RELEASE_TAG: qwen3-tool-runtime-hardening-v15
  PREFLIGHT_RUN: '33034877280'
  CFFI_PROBE_RUN: '33034762510'

jobs:
  release-v15:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout v15 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify locked successful V15 preflight before any APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN}" --jq '.conclusion')"
          test "$conclusion" = "success"
          probe="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CFFI_PROBE_RUN}" --jq '.conclusion')"
          test "$probe" = "success"
          echo "Locked V15 preflight: $PREFLIGHT_RUN = $conclusion"
          echo "Locked curl-cffi ABI probe: $CFFI_PROBE_RUN = $probe"

      - name: Setup Python 3.11 for host regression tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Compile and apply reviewed V15 patches
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/apply_iteration_v15_documents_runtime.py \
            scripts/apply_iteration_v15_curl_cffi_compat.py \
            scripts/apply_iteration_v15_python_sandbox.py \
            scripts/apply_iteration_v15_media.py \
            scripts/apply_iteration_v15_unlimited_tools.py \
            scripts/prepare_curl_cffi_android_wheel.py \
            scripts/validate_iteration_v15.py \
            scripts/validate_iteration_v15_curl_cffi_compat.py
          python3 scripts/apply_iteration_v15_documents_runtime.py
          python3 scripts/apply_iteration_v15_curl_cffi_compat.py
          python3 scripts/apply_iteration_v15_python_sandbox.py
          python3 scripts/apply_iteration_v15_media.py
          python3 scripts/apply_iteration_v15_unlimited_tools.py

      - name: Run V9 through V15 functional gates before build
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            anthropic requests beautifulsoup4 lxml pypdf reportlab \
            python-docx python-pptx openpyxl Pillow yt-dlp \
            'numpy<2' 'pandas<3' 'matplotlib<4'
          python3 scripts/run_validate_iteration_v9.py
          python3 scripts/validate_iteration_v10.py
          python3 scripts/validate_iteration_v11.py
          python3 scripts/validate_iteration_v12.py
          python3 scripts/validate_iteration_v13.py
          python3 scripts/validate_iteration_v14.py
          python3 scripts/validate_iteration_v15.py

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Align inappwebview Android library compile SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          pub = Path(os.environ['PUB_CACHE']) / 'hosted' / 'pub.dev'
          candidates = sorted(pub.glob('flutter_inappwebview_android-*/android/build.gradle'))
          if not candidates:
              raise SystemExit('flutter_inappwebview_android build.gradle not found')
          p = candidates[-1]
          text = p.read_text()
          for old, new in {
              'compileSdkVersion 33': 'compileSdkVersion 35',
              'compileSdkVersion 34': 'compileSdkVersion 35',
              'compileSdk 33': 'compileSdk 35',
              'compileSdk 34': 'compileSdk 35',
          }.items():
              text = text.replace(old, new)
          p.write_text(text)
          PY

      - name: Flutter static analysis gate before APK build
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Setup Python 3.13 for Android Chaquopy runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prepare exact official curl-cffi Android ARM64 binary and verify metadata shim
        run: |
          set -euo pipefail
          python3 scripts/prepare_curl_cffi_android_wheel.py
          python3 scripts/validate_iteration_v15_curl_cffi_compat.py

      - name: Setup Gradle 8.4 for final no-APK dependency gate
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Resolve exact ARM64 Android Python requirements one final time before APK build
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_BIN="$(command -v flutter)"
          FLUTTER_SDK="$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          cat > android/local.properties <<EOF
          sdk.dir=$SDK_ROOT
          flutter.sdk=$FLUTTER_SDK
          flutter.versionName=$BUILD_NAME
          flutter.versionCode=$BUILD_NUMBER
          EOF
          gradle -p android :app:generateDebugPythonRequirements --no-daemon 2>&1 | tee /tmp/v15-release-python-resolution.log
          verify_dep() {
            local pattern="$1"
            if grep -Eiq "$pattern" /tmp/v15-release-python-resolution.log; then return 0; fi
            if find android/app/build -print 2>/dev/null | grep -Eiq "$pattern"; then return 0; fi
            echo "Required Android Python dependency was not resolved: $pattern" >&2
            exit 1
          }
          verify_dep 'curl[_-]cffi.*0\.16\.2|curl[_-]cffi-0\.16\.2'
          verify_dep 'cffi.*1\.17\.1|cffi-1\.17\.1'
          verify_dep 'matplotlib.*3\.8\.4|matplotlib-3\.8\.4'
          verify_dep 'pandas.*2\.1\.3|pandas-2\.1\.3'
          verify_dep 'numpy.*1\.26\.2|numpy-1\.26\.2'

      - name: Restore exact known-good MLC runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 3 -o upstream-known-good.apk "$SOURCE_APK_URL"
          echo "$SOURCE_APK_SHA256  upstream-known-good.apk" | sha256sum -c -
          test "$(stat -c '%s' upstream-known-good.apk)" -eq 593655513
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          src = pathlib.Path('upstream-known-good.apk')
          dst = pathlib.Path('android/mlc4j/output/arm64-v8a/libtvm4j_runtime_packed.so')
          dst.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(src) as z:
              data = z.read('lib/arm64-v8a/libtvm4j_runtime_packed.so')
          assert len(data) == 38786520, len(data)
          digest = hashlib.sha256(data).hexdigest()
          assert digest == '5a3bb01f0819e85c07f58602161f6d020ecbf3e7f65922c9dfe898cfa0820c48', digest
          dst.write_bytes(data)
          print('Restored verified MLC runtime:', digest)
          PY

      - name: Restore stable signing identity and enforce one ARM64 build configuration
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/signing/rastacoder-dev-keystore.p12.b64 | base64 -d > android/app/rastacoder-dev.p12
          test "$(sha256sum android/app/rastacoder-dev.p12 | awk '{print $1}')" = "7048dea7d7152b80255716de2338eea539acd898cc3b8ecf8a9ca2203f21b169"
          cat > android/key.properties <<'EOF'
          storeFile=rastacoder-dev.p12
          storePassword=RastaCoderDev2026!
          keyAlias=rastacoder-dev
          keyPassword=RastaCoderDev2026!
          EOF
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('android/app/build.gradle')
          text = p.read_text()
          text = text.replace('abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"', 'abiFilters "arm64-v8a"')
          start = text.find('        debug {')
          end = text.find('        release {', start)
          if start < 0 or end < 0:
              raise SystemExit('debug/release buildTypes not found')
          block = text[start:end]
          signing = "            signingConfig keystoreProperties.containsKey('storeFile') ? signingConfigs.release : signingConfigs.debug\n"
          lines = [line for line in block.splitlines(True) if 'signingConfig keystoreProperties.containsKey' not in line]
          rebuilt = ''.join(lines)
          anchor = '            buildConfigField "boolean", "NAVIXMIND_DEBUG", "true"\n'
          if anchor not in rebuilt:
              raise SystemExit('debug signing anchor not found')
          rebuilt = rebuilt.replace(anchor, anchor + signing, 1)
          text = text[:start] + rebuilt + text[end:]
          p.write_text(text)
          PY

      - name: Build the single final stable-signed ARM64 V15 APK
        run: |
          set -euo pipefail
          flutter build apk --debug --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          cp build/app/outputs/flutter-apk/app-debug.apk "$OUTPUT_APK"
          test -s "$OUTPUT_APK"

      - name: Verify final V15 APK package signature ABI runtime and regression gates
        id: verify_release
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            sdkmanager 'build-tools;35.0.0' >/dev/null
            APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          fi
          AAPT="$(dirname "$APKSIGNER")/aapt"
          BADGING="$($AAPT dump badging "$OUTPUT_APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -F "package: name='$EXPECTED_PACKAGE'"
          echo "$BADGING" | grep -F "versionCode='$BUILD_NUMBER'"
          echo "$BADGING" | grep -F "versionName='$BUILD_NAME'"
          "$APKSIGNER" verify --verbose --print-certs "$OUTPUT_APK" | tee apksigner.txt
          CERT_SHA="$(awk -F': ' '/certificate SHA-256 digest/{print tolower($NF); exit}' apksigner.txt | tr -d ':')"
          test "$CERT_SHA" = "$EXPECTED_CERT_SHA256"
          python3 - <<'PY'
          import hashlib, os, zipfile
          apk = os.environ['OUTPUT_APK']
          with zipfile.ZipFile(apk) as z:
              names = z.namelist()
              abis = sorted({n.split('/')[1] for n in names if n.startswith('lib/') and len(n.split('/')) >= 3})
              assert abis == ['arm64-v8a'], abis
              runtime = 'lib/arm64-v8a/libtvm4j_runtime_packed.so'
              data = z.read(runtime)
              assert len(data) == 38786520, len(data)
              digest = hashlib.sha256(data).hexdigest()
              assert digest == os.environ['EXPECTED_RUNTIME_SHA256'], digest
          PY
          python3 -m pip install -q \
            anthropic requests beautifulsoup4 lxml pypdf reportlab \
            python-docx python-pptx openpyxl Pillow yt-dlp \
            'numpy<2' 'pandas<3' 'matplotlib<4'
          python3 scripts/run_validate_iteration_v9.py
          python3 scripts/validate_iteration_v10.py
          python3 scripts/validate_iteration_v11.py
          python3 scripts/validate_iteration_v12.py
          python3 scripts/validate_iteration_v13.py
          python3 scripts/validate_iteration_v14.py
          python3 scripts/validate_iteration_v15.py
          python3 scripts/validate_iteration_v15_curl_cffi_compat.py
          OUT_SHA="$(sha256sum "$OUTPUT_APK" | awk '{print $1}')"
          OUT_SIZE="$(stat -c '%s' "$OUTPUT_APK")"
          echo "out_sha=$OUT_SHA" >> "$GITHUB_OUTPUT"
          echo "out_size=$OUT_SIZE" >> "$GITHUB_OUTPUT"
          echo "cert_sha=$CERT_SHA" >> "$GITHUB_OUTPUT"
          echo "Final APK SHA-256: $OUT_SHA"
          echo "Final APK size: $OUT_SIZE"

      - name: Persist verified V15 generated source and handoff
        env:
          OUT_SHA: ${{ steps.verify_release.outputs.out_sha }}
          OUT_SIZE: ${{ steps.verify_release.outputs.out_size }}
        run: |
          set -euo pipefail
          rm -f android/app/rastacoder-dev.p12 android/key.properties android/local.properties upstream-known-good.apk
          rm -rf android/app/vendor
          cat > docs/HANDOFF_QWEN3_TOOL_RUNTIME_HARDENING_V15.md <<EOF
          # RastaCoder Qwen3 Tool Runtime Hardening v15 — verified release handoff

          Branch: \`iteration/qwen3-tool-runtime-hardening-v15\`
          Release tag: \`$RELEASE_TAG\`
          Version: \`$BUILD_NAME\` / code \`$BUILD_NUMBER\`
          Package: \`$EXPECTED_PACKAGE\`
          Full no-APK preflight: \`$PREFLIGHT_RUN\`
          curl-cffi/CFFI compatibility probe: \`$CFFI_PROBE_RUN\`

          ## V15 verified fixes
          - Preserves exactly 25 manually controlled Skills / 37 canonical local functions and all V9-V14 safeguards.
          - PPTX speaker notes package resources are extracted for python-pptx notesMaster creation.
          - ZIP extraction accepts archive-declared zero-byte files while retaining strict postconditions for unexpected empty outputs.
          - FFmpeg audio filtering chooses codecs from the output target; numeric mix duration is treated as an output time limit; convert and extract-frame paths remain covered.
          - Image conversion normalizes jpg/jpeg/png/webp/bmp/gif/tif/tiff aliases before Pillow save.
          - Python OUTPUT_DIR files can be read back in the same execution; safe os.path and safe package-version diagnostics are enabled while dangerous os and dunder access remain blocked.
          - OCR reports explicit no-text state.
          - XLSX values mode falls back to formulas when cached formula values are absent instead of returning an all-null matrix.
          - download_media has clear non-media URL handling and browser TLS impersonation support.
          - Unlimited tool-call mode uses zero as an explicit sentinel and removes both the call counter and tool-driven ReAct iteration ceiling; 15/25/50/100 limits remain available.

          ## Android browser impersonation runtime
          - Official curl-cffi 0.16.2 CPython 3.13 Android ARM64 wheel source SHA-256 is pinned to \`58598186eccd24d2b2e126f945d8a5bdca0066a2789052023d3d8370ebadca30\`.
          - Probe run \`$CFFI_PROBE_RUN\` proved curl-cffi import, HTTPS and Chrome impersonation with cffi/_cffi_backend 1.17.1.
          - The Android packaging shim changes only the wheel dependency metadata to the proven cffi 1.17.1 backend; all official executable/package payload members remain byte-identical.

          ## Final verified artifact
          - ABI: \`arm64-v8a\` only
          - Stable signing certificate SHA-256: \`$EXPECTED_CERT_SHA256\`
          - MLC runtime SHA-256: \`$EXPECTED_RUNTIME_SHA256\`
          - APK SHA-256: \`$OUT_SHA\`
          - APK size: \`$OUT_SIZE\` bytes
          EOF

          cat > docs/V15_LIVE_PROGRESS_AND_HANDOFF.md <<EOF
          # RastaCoder V15 live progress and handoff

          - Complete V9-V15 no-APK preflight \`$PREFLIGHT_RUN\`: SUCCESS.
          - curl-cffi/CFFI browser impersonation probe \`$CFFI_PROBE_RUN\`: SUCCESS.
          - 25 Skills / 37 canonical local functions preserved.
          - All 11 reported tool/runtime issues plus unlimited tool-call mode are covered by V15 regression gates.
          - Flutter static analysis and exact Chaquopy ARM64 dependency resolution passed before the single formal APK build.
          - Verified APK SHA-256: \`$OUT_SHA\`.
          - Verified APK size: \`$OUT_SIZE\` bytes.
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add docs/HANDOFF_QWEN3_TOOL_RUNTIME_HARDENING_V15.md docs/V15_LIVE_PROGRESS_AND_HANDOFF.md
          if ! git diff --cached --quiet; then
            git commit -m 'feat: persist verified tool runtime hardening v15 source and handoff [skip ci]'
            git push origin HEAD:iteration/qwen3-tool-runtime-hardening-v15
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_SHA: ${{ steps.verify_release.outputs.out_sha }}
          OUT_SIZE: ${{ steps.verify_release.outputs.out_size }}
          CERT_SHA: ${{ steps.verify_release.outputs.cert_sha }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          RastaCoder Qwen3 4B Tool Runtime Hardening v15

          Version: $BUILD_NAME ($BUILD_NUMBER)
          Package: $EXPECTED_PACKAGE
          ABI: arm64-v8a only
          APK SHA-256: $OUT_SHA
          APK size: $OUT_SIZE bytes
          Signing certificate SHA-256: $CERT_SHA
          MLC runtime SHA-256: $EXPECTED_RUNTIME_SHA256

          V15 fixes the 11 issues found by the full cloud-model tool audit: PPTX notes resources, zero-byte ZIP members, FFmpeg output codecs and numeric mix duration, image format aliases, Python OUTPUT_DIR readback and safe imports/version diagnostics, OCR no-text signaling, XLSX uncached-formula fallback, and download_media browser impersonation/non-media handling. It also adds a true unlimited tool-call option which removes both the tool counter and tool-driven step ceiling while retaining the existing finite limits.

          Full no-APK preflight: https://github.com/${GITHUB_REPOSITORY}/actions/runs/$PREFLIGHT_RUN
          curl-cffi compatibility probe: https://github.com/${GITHUB_REPOSITORY}/actions/runs/$CFFI_PROBE_RUN
          EOF
          gh release create "$RELEASE_TAG" "$OUTPUT_APK" \
            --target iteration/qwen3-tool-runtime-hardening-v15 \
            --title 'RastaCoder Qwen3 4B Tool Runtime Hardening v15' \
            --notes-file release-notes.md

      - name: Cleanup signing and generated vendor materials
        if: always()
        run: |
          rm -f android/app/rastacoder-dev.p12 android/key.properties android/local.properties
          rm -rf android/app/vendor
