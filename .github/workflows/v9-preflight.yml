name: Preflight RastaCoder Systemic Tool Hardening v9

on:
  push:
    branches:
      - iteration/qwen3-systemic-tool-hardening-v9
    paths:
      - 'V9_PREFLIGHT_TRIGGER.md'

permissions:
  contents: read

jobs:
  preflight-v9:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout v9 branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile patch scripts before touching source
        run: |
          python3 -m py_compile \
            scripts/apply_iteration_v9_backend.py \
            scripts/apply_iteration_v9_office.py \
            scripts/apply_iteration_v9_flutter_native.py \
            scripts/apply_iteration_v9_fixups.py \
            scripts/run_validate_iteration_v9.py

      - name: Apply complete reviewed v9 patch chain
        run: |
          set -euo pipefail
          python3 scripts/apply_iteration_v9_backend.py
          python3 scripts/apply_iteration_v9_office.py
          python3 scripts/apply_iteration_v9_flutter_native.py
          python3 scripts/apply_iteration_v9_fixups.py

      - name: Compile generated Python source
        run: |
          python3 -m py_compile \
            python/navixmind/agent.py \
            python/navixmind/tools/__init__.py \
            python/navixmind/tools/compat.py \
            python/navixmind/tools/documents.py \
            python/navixmind/tools/extended_tools.py \
            python/navixmind/tools/media.py \
            python/navixmind/tools/search_tools.py

      - name: Install validation dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install anthropic requests beautifulsoup4 lxml pypdf reportlab python-docx python-pptx openpyxl Pillow yt-dlp numpy pandas matplotlib

      - name: Run systemic v9 functional regression gate
        run: python3 scripts/run_validate_iteration_v9.py

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Align inappwebview Android library compile SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          pub = Path(os.environ['PUB_CACHE']) / 'hosted' / 'pub.dev'
          candidates = sorted(pub.glob('flutter_inappwebview_android-*/android/build.gradle'))
          if not candidates:
              raise SystemExit('flutter_inappwebview_android build.gradle not found')
          p = candidates[-1]
          text = p.read_text()
          for old, new in {
              'compileSdkVersion 33': 'compileSdkVersion 35',
              'compileSdkVersion 34': 'compileSdkVersion 35',
              'compileSdk 33': 'compileSdk 35',
              'compileSdk 34': 'compileSdk 35',
          }.items():
              text = text.replace(old, new)
          p.write_text(text)
          PY

      - name: Flutter static analysis gate
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Preflight summary
        run: |
          echo 'V9 no-APK preflight passed.'
          echo 'Reported speed/search/DOCX cases and generalized mutation/postcondition gates passed.'
          echo '25 manual Skills still cover exactly 37 canonical local functions.'
