name: RastaCoder v9 Systemic Tool Hardening Preflight

on:
  push:
    branches:
      - iteration/qwen3-systemic-tool-hardening-v9
    paths:
      - 'V9_PREFLIGHT_TRIGGER.md'
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout v9 branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply reviewed v9 systemic patch chain to verified v8 source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_iteration_v9_core.py
          python3 scripts/apply_iteration_v9_search_ui.py

      - name: Compile all touched Python sources and patch scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/apply_iteration_v9_core.py \
            scripts/apply_iteration_v9_search_ui.py \
            scripts/validate_iteration_v9.py \
            python/navixmind/agent.py \
            python/navixmind/tools/__init__.py \
            python/navixmind/tools/compat.py \
            python/navixmind/tools/documents.py \
            python/navixmind/tools/extended_tools.py \
            python/navixmind/tools/search_tools.py \
            python/navixmind/tools/media.py \
            python/navixmind/tools/google_api.py

      - name: Install systemic validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install anthropic requests beautifulsoup4 lxml pypdf reportlab python-docx python-pptx openpyxl Pillow yt-dlp numpy pandas matplotlib
          command -v ffmpeg
          command -v ffprobe

      - name: Run v9 systemic and real-mutation regression validation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_iteration_v9.py
          grep -F "case 'speed':" lib/core/services/native_tool_executor.dart
          grep -F 'duration_verified' lib/core/services/native_tool_executor.dart
          grep -F 'anysearch_search(query)' python/navixmind/tools/__init__.py
          grep -F 'exa_search(query)' python/navixmind/tools/__init__.py
          grep -F 'langsearch_search(query)' python/navixmind/tools/__init__.py
          grep -F 'tavily_search(query)' python/navixmind/tools/__init__.py
          grep -F 'DOCX post-verification failed' python/navixmind/tools/documents.py
          grep -F 'TOOL_POST_VERIFY_ERROR' python/navixmind/tools/__init__.py
          grep -F "'search_settings': searchSettings" lib/core/bridge/bridge.dart

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Align inappwebview Android library compile SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          pub = Path(os.environ['PUB_CACHE']) / 'hosted' / 'pub.dev'
          candidates = sorted(pub.glob('flutter_inappwebview_android-*/android/build.gradle'))
          if not candidates:
              raise SystemExit('flutter_inappwebview_android build.gradle not found')
          p = candidates[-1]
          text = p.read_text()
          for old, new in {
              'compileSdkVersion 33': 'compileSdkVersion 35',
              'compileSdkVersion 34': 'compileSdkVersion 35',
              'compileSdk 33': 'compileSdk 35',
              'compileSdk 34': 'compileSdk 35',
          }.items():
              text = text.replace(old, new)
          p.write_text(text)
          PY

      - name: Flutter static analysis gate
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Preflight summary
        run: |
          echo 'V9 no-APK preflight passed.'
          echo 'Validated reported speed/search/DOCX cases plus generalized Office/PDF/file/media/result-truth gates.'
          echo '25 manual Skills still cover exactly 37 canonical local functions.'
