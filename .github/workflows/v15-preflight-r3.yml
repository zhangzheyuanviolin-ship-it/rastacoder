name: Preflight RastaCoder Tool Runtime Hardening v15 R3

on:
  push:
    branches:
      - iteration/qwen3-tool-runtime-hardening-v15
    paths:
      - 'V15_PREFLIGHT_R3_TRIGGER.md'

permissions:
  contents: read

jobs:
  preflight-v15-r3:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout v15 branch
        uses: actions/checkout@v4

      - name: Setup Python 3.11 for host regression tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile reviewed V15 patch scripts and validators before touching source
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/apply_iteration_v15_documents_runtime.py \
            scripts/apply_iteration_v15_curl_cffi_compat.py \
            scripts/apply_iteration_v15_python_sandbox.py \
            scripts/apply_iteration_v15_media.py \
            scripts/apply_iteration_v15_unlimited_tools.py \
            scripts/prepare_curl_cffi_android_wheel.py \
            scripts/validate_iteration_v10.py \
            scripts/validate_iteration_v11.py \
            scripts/validate_iteration_v12.py \
            scripts/validate_iteration_v13.py \
            scripts/validate_iteration_v14.py \
            scripts/validate_iteration_v15.py \
            scripts/validate_iteration_v15_curl_cffi_compat.py

      - name: Apply reviewed V15 systemic patches
        run: |
          set -euo pipefail
          python3 scripts/apply_iteration_v15_documents_runtime.py
          python3 scripts/apply_iteration_v15_curl_cffi_compat.py
          python3 scripts/apply_iteration_v15_python_sandbox.py
          python3 scripts/apply_iteration_v15_media.py
          python3 scripts/apply_iteration_v15_unlimited_tools.py

      - name: Compile generated Python source
        run: |
          set -euo pipefail
          python3 -m py_compile \
            python/navixmind/agent.py \
            python/navixmind/tools/__init__.py \
            python/navixmind/tools/compat.py \
            python/navixmind/tools/documents.py \
            python/navixmind/tools/extended_tools.py \
            python/navixmind/tools/code_executor.py \
            python/navixmind/tools/media.py \
            python/navixmind/tools/path_contract.py \
            scripts/validate_iteration_v15.py

      - name: Install host validation dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            anthropic requests beautifulsoup4 lxml pypdf reportlab \
            python-docx python-pptx openpyxl Pillow yt-dlp \
            'numpy<2' 'pandas<3' 'matplotlib<4'

      - name: Preserve V9 systemic tool regression gates
        run: python3 scripts/run_validate_iteration_v9.py

      - name: Preserve V10 context-safe and history gates
        run: python3 scripts/validate_iteration_v10.py

      - name: Preserve V11 provider and history gates
        run: python3 scripts/validate_iteration_v11.py

      - name: Preserve V12 workspace alias gates
        run: python3 scripts/validate_iteration_v12.py

      - name: Preserve V13 systemic Tool ABI and document-ingestion gates
        run: python3 scripts/validate_iteration_v13.py

      - name: Preserve V14 result-boundary streaming and history gates
        run: python3 scripts/validate_iteration_v14.py

      - name: Run V15 document sandbox media XLSX ZIP OCR and unlimited-tool gates
        run: python3 scripts/validate_iteration_v15.py

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Align inappwebview Android library compile SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          pub = Path(os.environ['PUB_CACHE']) / 'hosted' / 'pub.dev'
          candidates = sorted(pub.glob('flutter_inappwebview_android-*/android/build.gradle'))
          if not candidates:
              raise SystemExit('flutter_inappwebview_android build.gradle not found')
          p = candidates[-1]
          text = p.read_text()
          for old, new in {
              'compileSdkVersion 33': 'compileSdkVersion 35',
              'compileSdkVersion 34': 'compileSdkVersion 35',
              'compileSdk 33': 'compileSdk 35',
              'compileSdk 34': 'compileSdk 35',
          }.items():
              text = text.replace(old, new)
          p.write_text(text)
          PY

      - name: Flutter static analysis gate
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Setup Python 3.13 for exact Android Chaquopy dependency resolution
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prepare and validate exact official curl-cffi Android ARM64 binary
        run: |
          set -euo pipefail
          python3 scripts/prepare_curl_cffi_android_wheel.py
          python3 scripts/validate_iteration_v15_curl_cffi_compat.py

      - name: Setup Gradle 8.4 for no-APK Android dependency resolution
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Resolve exact ARM64 Android Python requirements without building an APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          text = p.read_text()
          text = text.replace(
              'abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"',
              'abiFilters "arm64-v8a"',
          )
          p.write_text(text)
          PY
          FLUTTER_BIN="$(command -v flutter)"
          FLUTTER_SDK="$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          cat > android/local.properties <<EOF
          sdk.dir=$SDK_ROOT
          flutter.sdk=$FLUTTER_SDK
          EOF
          gradle -p android :app:generateDebugPythonRequirements --no-daemon 2>&1 | tee /tmp/v15-chaquopy-resolution.log
          verify_dep() {
            local pattern="$1"
            if grep -Eiq "$pattern" /tmp/v15-chaquopy-resolution.log; then
              return 0
            fi
            if find android/app/build -print 2>/dev/null | grep -Eiq "$pattern"; then
              return 0
            fi
            echo "Required Android Python dependency was not resolved: $pattern" >&2
            exit 1
          }
          verify_dep 'curl[_-]cffi.*0\.16\.2|curl[_-]cffi-0\.16\.2'
          verify_dep 'cffi.*1\.17\.1|cffi-1\.17\.1'
          verify_dep 'matplotlib.*3\.8\.4|matplotlib-3\.8\.4'
          verify_dep 'pandas.*2\.1\.3|pandas-2\.1\.3'
          verify_dep 'numpy.*1\.26\.2|numpy-1\.26\.2'

      - name: Preflight summary
        run: |
          echo 'V15 R3 no-APK preflight passed.'
          echo 'All inherited V9-V14 regression gates remain green.'
          echo 'V15 document, ZIP, XLSX, image, Python sandbox, FFmpeg, OCR, download_media and unlimited-tool gates passed.'
          echo 'Official curl-cffi 0.16.2 Android ARM64 wheel source SHA was verified and only dependency metadata was adjusted.'
          echo 'The curl-cffi wrapper ABI was separately proven by no-APK probe run 33034762510 with cffi/_cffi_backend 1.17.1 and real Chrome impersonation.'
          echo 'Flutter static analysis and exact Chaquopy ARM64 dependency resolution passed without producing an APK.'
